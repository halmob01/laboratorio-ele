<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Laboratorio elettrico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sinistra la stanza con la luce, destra il banco di lavoro con i componenti da cablare */
:root{
  --bg:#EDF1F0; --ink:#17201E; --ink2:#52635F; --card:#FFFFFF; --line:#CDD6D3;
  --bench:#DCE2DF; --dot:#B3BFBB; --comp:#FAFBFA; --comp-edge:#7C8B86; --sch:#667773;
  --metal:#C9D0CD; --metal-edge:#5E6C68; --slot:#2F3B38;
  --accent:#D9480F; --on-accent:#FFFFFF; --ok:#17794A; --bad:#BE2530; --warn:#8F5600;
  --wall:#D3DCE6; --floor:#B99A70; --skirt:#9AA8B6; --shade:#ECE7DA; --bulb-off:#C7CECB;
  --plate:#F4F5F4; --plate-edge:#8A9692; --rkhi:#FFFFFF; --rklo:#B9C2BF;
  --wire-edge:rgba(18,26,24,.55); --breaker:#EEF0EF; --chip:#E7EDEB; --table:#8A6A48;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1514; --ink:#E6EEEC; --ink2:#9DAEA9; --card:#172120; --line:#2B3735;
    --bench:#1D2827; --dot:#2D3B38; --comp:#2B3836; --comp-edge:#6F837E; --sch:#9BADA8;
    --metal:#8F9C98; --metal-edge:#CBD5D2; --slot:#1C2523;
    --accent:#FF7A33; --on-accent:#1A0D05; --ok:#4CC38A; --bad:#FF6B73; --warn:#E8A33A;
    --wall:#2B3543; --floor:#4B4036; --skirt:#3A4655; --shade:#B9B3A4; --bulb-off:#53605D;
    --plate:#C9D0CE; --plate-edge:#6F7C78; --rkhi:#F3F6F5; --rklo:#8E9996;
    --wire-edge:rgba(235,243,241,.6); --breaker:#D9DEDD; --chip:#223130; --table:#5B4630;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0F1514; --ink:#E6EEEC; --ink2:#9DAEA9; --card:#172120; --line:#2B3735;
    --bench:#1D2827; --dot:#2D3B38; --comp:#2B3836; --comp-edge:#6F837E; --sch:#9BADA8;
    --metal:#8F9C98; --metal-edge:#CBD5D2; --slot:#1C2523;
    --accent:#FF7A33; --on-accent:#1A0D05; --ok:#4CC38A; --bad:#FF6B73; --warn:#E8A33A;
    --wall:#2B3543; --floor:#4B4036; --skirt:#3A4655; --shade:#B9B3A4; --bulb-off:#53605D;
    --plate:#C9D0CE; --plate-edge:#6F7C78; --rkhi:#F3F6F5; --rklo:#8E9996;
    --wire-edge:rgba(235,243,241,.6); --breaker:#D9DEDD; --chip:#223130; --table:#5B4630;
    color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;padding-inline:16px;padding-block:14px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:'Barlow Condensed','Barlow',system-ui,sans-serif;font-weight:600;margin:0;letter-spacing:.01em}
h1{font-size:26px;line-height:1.1}
h2{font-size:24px;line-height:1.15}
p{margin:0}
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.levels{display:flex;flex-wrap:wrap;gap:8px}
.lv{font:500 15px/1.1 'Barlow',system-ui,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:92px}
.lv small{font:500 13px/1 'IBM Plex Mono',ui-monospace,monospace;color:var(--ink2);letter-spacing:.05em}
.lv[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.lv:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media (min-width:920px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}.left{position:sticky;top:12px}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.kicker{font:500 12px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.goal p{color:var(--ink2);margin-top:6px;max-width:62ch}
.roomcard{padding:0;overflow:hidden}
#room{display:block;width:100%;height:auto}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.pill{font:500 13px/1 'IBM Plex Mono',ui-monospace,monospace;padding:6px 9px;border-radius:6px;background:var(--chip);color:var(--ink)}
.pill.on{background:#FFD25E;color:#2A1B00}
.pill.bad{background:var(--bad);color:#fff}
.pill.ok{background:var(--ok);color:#fff}
.msg{flex-basis:100%;font-size:15px;color:var(--ink2);min-height:22px}
.info h3{font:600 17px/1.2 'Barlow Condensed',sans-serif;margin:0 0 4px;letter-spacing:.02em}
.info p{color:var(--ink2);max-width:62ch}
.mode{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mlabel{font:500 13px/1 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.mlabel.hint{text-transform:none;letter-spacing:0;font:400 14px/1.2 'Barlow',sans-serif}
.led.blink{animation:blink 1.4s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.25}}
.palette{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{display:flex;align-items:center;gap:8px;font:500 14px/1 'Barlow',sans-serif;background:var(--chip);color:var(--ink);border:1px solid transparent;border-radius:999px;padding:7px 12px 7px 8px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sw{width:30px;height:12px;border-radius:6px;border:1px solid var(--wire-edge);display:block}
.tip{font-size:14px;color:var(--ink2);margin-bottom:8px}
#bench{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button.btn{font:500 15px/1 'Barlow',sans-serif;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:11px 14px;cursor:pointer}
button.btn:hover{border-color:var(--comp-edge)}
button.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600;margin-left:auto}
.res h3{font:600 20px/1.2 'Barlow Condensed',sans-serif;margin:0 0 8px}
.stars{font-size:26px;letter-spacing:4px;color:#F2A900;line-height:1}
.stars .e{color:var(--line)}
.row{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 8px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.mark{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 14px/1 'IBM Plex Mono',monospace;color:#fff}
.mark.ok{background:var(--ok)}.mark.ko{background:var(--bad)}.mark.na{background:var(--comp-edge)}
.row b{font-weight:600}
.row ul{margin:2px 0 0;padding-left:18px;color:var(--ink2);font-size:15px}
.next{margin-top:10px}
.muted{color:var(--ink2)}

/* banco di lavoro */
.ttl{font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;fill:var(--ink2)}
.lbl{font:500 11px 'IBM Plex Mono',monospace;fill:var(--ink);pointer-events:none}
.body{fill:var(--comp);stroke:var(--comp-edge);stroke-width:1.5}
.help{cursor:pointer}.help circle{fill:var(--chip);stroke:var(--comp-edge)}.help text{font:600 12px 'Barlow',sans-serif;fill:var(--ink)}
.cl{stroke:var(--sch);stroke-width:2.6;fill:none;stroke-linecap:round}
.cl.on{stroke:#F59F00}.cl.off{stroke-dasharray:3 5;opacity:.45}
.ct{fill:var(--comp);stroke:var(--sch);stroke-width:2}
.hole{fill:var(--slot)}
.faceplate{fill:var(--plate);stroke:var(--plate-edge);stroke-width:1.2}
.term{cursor:pointer;touch-action:none}
.term .hit{fill:transparent}
.term .halo{fill:none;stroke:var(--accent);stroke-width:3;opacity:0}
.term:hover .halo{opacity:.55}
.term.sel .halo{opacity:1;animation:pulse 1s ease-in-out infinite}
.screw{fill:var(--metal);stroke:var(--metal-edge);stroke-width:1.6}
.slot{stroke:var(--slot);stroke-width:2.4;stroke-linecap:round}
@keyframes pulse{50%{stroke-width:6}}
.w-hit{fill:none;stroke:transparent;stroke-width:18;cursor:pointer}
.w-edge{fill:none;stroke:var(--wire-edge);stroke-width:9;stroke-linecap:round;pointer-events:none}
.w-col{fill:none;stroke-width:5.5;stroke-linecap:round;pointer-events:none}
.w-col.dash{stroke-dasharray:9 9}
.flow{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:1 12;animation:fl .9s linear infinite;pointer-events:none}
.flow.f{stroke:#FFE08A}.flow.n{stroke:#D7EEFF}
@keyframes fl{to{stroke-dashoffset:-13}}
.ghost{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:3 9;opacity:.8;pointer-events:none}
#prev{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:6 6;pointer-events:none}
.brk{cursor:pointer}
.brk .hs{fill:var(--breaker);stroke:var(--comp-edge);stroke-width:1.5}
.brk .slotr{fill:var(--slot)}
.brk .knob{fill:#fff;stroke:var(--metal-edge);stroke-width:1.4;transition:transform .15s}
.led{fill:var(--comp-edge)}.led.on{fill:#2BD17E}.led.trip{fill:#FF4B55}
/* stanza */
.wall{fill:var(--wall)}.floor{fill:var(--floor)}.skirt{fill:var(--skirt)}
.night{fill:#050816;transition:opacity .55s ease}
.glowc{transition:opacity .55s ease}
.bulb{fill:var(--bulb-off);stroke:var(--comp-edge);stroke-width:1.2;transition:fill .3s}
.bulb.on{fill:#FFD25E;stroke:#E8A100}
.shade{fill:var(--shade);stroke:var(--comp-edge);stroke-width:1.2}
.plate{fill:var(--plate);stroke:var(--plate-edge);stroke-width:1.4}
.rk{stroke:var(--plate-edge);stroke-width:1}
.rk.hi{fill:var(--rkhi)}.rk.lo{fill:var(--rklo)}
.pl{cursor:pointer}
.pl text{font:500 12px 'Barlow',sans-serif;fill:#EAF0F8}
@media (prefers-reduced-motion:reduce){.led.blink,.flow,.term.sel .halo{animation:none}.night,.glowc{transition:none}}

.info .x{display:none}
@media (max-width:919px){
  body{padding-block:10px 28px}
  .wrap,.grid{gap:10px}
  .col{display:contents}
  .goal{order:1}.roomcard{order:2}.benchcard{order:3}.res{order:4}
  .top{gap:8px}
  h1{font-size:22px}
  .brand svg{width:26px;height:26px}
  .levels{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:4px;margin-inline:-2px;scrollbar-width:none}
  .levels::-webkit-scrollbar{display:none}
  .lv{flex:none;min-width:88px;padding:9px 12px}
  .card{padding:12px}
  .goal h2{font-size:21px}
  .goal p{font-size:15px;margin-top:4px}
  .roomcard{position:sticky;top:0;z-index:6;padding:0}
  #room{width:100%;height:auto;aspect-ratio:400/108}
  .status{position:absolute;left:8px;right:8px;bottom:6px;padding:0;border:0;gap:6px;pointer-events:none}
  .status .pill{font-size:12px;padding:5px 8px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
  .msg{background:rgba(8,12,20,.82);color:#fff;border-radius:8px;padding:6px 9px;font-size:13px;line-height:1.3;min-height:0;pointer-events:auto}
  .msg:empty{display:none}
  .benchcard{padding:12px 0}
  .benchcard>.mode,.benchcard>.tip,.benchcard>.actions{margin-inline:12px}
  .benchcard>.palette{position:sticky;top:var(--roomH,104px);z-index:5;background:var(--card);margin:0 0 6px;padding:8px 12px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;border-bottom:1px solid var(--line)}
  .chip{flex-direction:column;align-items:stretch;gap:5px;border-radius:10px;padding:6px 4px 6px;font-size:12px;text-align:center;line-height:1.1;overflow-wrap:anywhere}
  .chip .sw{width:100%;height:12px}
  .seg.chip{flex-direction:row;justify-content:center;padding:9px 14px;font-size:14px;border-radius:999px;min-height:40px;align-items:center}
  .mode{gap:6px}
  .mlabel.hint{flex-basis:100%;font-size:13px}
  #bench{border-radius:0;border-inline:0}
  .term .halo{stroke-width:3.5}
  .lbl{font-size:12px}
  .ttl{font-size:14px}
  .w-hit{stroke-width:24px}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  button.btn{min-height:46px;font-size:16px}
  button.btn.primary{grid-column:1/-1;margin-left:0}
  .res{scroll-margin-top:calc(var(--roomH,104px) + 12px)}
  .res h3{font-size:19px}
  .info{display:none}
  .info.open{display:block;position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.35);border-color:var(--comp-edge)}
  .info .x{display:block;float:right;margin:-4px -4px 6px 10px;font:500 14px/1 'Barlow',sans-serif;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-height:40px}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="7" fill="var(--accent)"/><path d="M17 5 9 17h6l-2 8 8-12h-6z" fill="var(--on-accent)"/></svg>
      <h1>Laboratorio elettrico</h1>
    </div>
    <nav class="levels" id="levels" aria-label="Livelli"></nav>
  </header>

  <main class="grid">
    <section class="col left" aria-label="Stanza">
      <div class="card goal"><div class="kicker" id="kick"></div><h2 id="lvName"></h2><p id="lvGoal"></p></div>
      <div class="card roomcard">
        <svg id="room" viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stanza con la luce da accendere"></svg>
        <div class="status" id="status"></div>
      </div>
      <div class="card info" id="info"></div>
    </section>

    <section class="col" aria-label="Banco di lavoro">
      <div class="card benchcard">
        <div class="mode" role="group" aria-label="Punto di partenza"><span class="mlabel">Parti dal</span><button class="chip seg" data-mode="quadro" aria-pressed="true">Quadro</button><button class="chip seg" data-mode="contatore" aria-pressed="false">Contatore</button><span class="mlabel hint">il contatore è la versione completa</span></div>
        <div class="palette" id="palette" role="group" aria-label="Colore del filo"></div>
        <p class="tip">Scegli il colore, poi tocca due morsetti per collegarli (o trascina). Tocca un filo per toglierlo. Per provare: dai corrente dal quadro e tocca l’interruttore.</p>
        <svg id="bench" role="img" aria-label="Banco di lavoro con i componenti da collegare"></svg>
        <div class="actions">
          <button class="btn" id="bUndo">Annulla filo</button>
          <button class="btn" id="bClear">Svuota</button>
          <button class="btn" id="bHint">Suggerimento</button>
          <button class="btn" id="bSol" aria-pressed="false">Mostra soluzione</button>
          <button class="btn primary" id="bCheck">Verifica</button>
        </div>
      </div>
      <div class="card res" id="result" aria-live="polite"></div>
    </section>
  </main>
</div>

<script>
//ENGINE-START
const COLORS={
  marrone:{n:'Marrone',base:'#8A5224'},
  nero:{n:'Nero',base:'#222222'},
  grigio:{n:'Grigio',base:'#9AA3A0'},
  blu:{n:'Blu',base:'#3D9BE9'},
  gv:{n:'Giallo-verde',base:'#E4C400',dash:'#2E8B3D'}
};
const PHASE_OK=['marrone','nero','grigio'];
const T=(f,s,l,n)=>({f,s,l,n});
const SRC=lv=>lv.src||{F:'Q.F',N:'Q.N',PE:'Q.PE'};
const LEVELS=[
{n:1,name:'Presa',title:'La presa di corrente',
 goal:'Collega la presa al quadro con i tre fili giusti, poi dai corrente con la levetta del quadro. La lampada sul tavolo deve accendersi.',
 loadName:'La lampada',
 comps:[
  {id:'Q',type:'quadro',short:'Quadro',title:'Quadro elettrico',x:20,y:0,w:380,h:100,terms:{F:T(.2,'b','FASE'),PE:T(.5,'b','TERRA'),N:T(.8,'b','NEUTRO')}},
  {id:'P',type:'presa',short:'Presa',title:'Presa bipasso 10/16 A',x:110,y:170,w:200,h:120,terms:{L:T(.2,'t','L'),PE:T(.5,'t','PE'),N:T(.8,'t','N')}}
 ],
 controls:[],load:['P.L','P.N'],earth:['Q.PE','P.PE'],pol:'P.L',room:'tavolo',
 solution:[['Q.F','P.L','marrone'],['Q.N','P.N','blu'],['Q.PE','P.PE','gv']],
 hints:['Il marrone è la fase: va dal quadro al morsetto L della presa.','Il blu è il neutro: va dal quadro al morsetto N della presa.','Il giallo-verde è la terra: va al morsetto PE, quello al centro.']},
{n:2,name:'Interrotto',title:'Punto luce interrotto',
 goal:'Accendi e spegni la lampada con un interruttore. L’interruttore interrompe la fase, mai il neutro.',
 loadName:'La lampada',
 comps:[
  {id:'Q',type:'quadro',short:'Quadro',title:'Quadro elettrico',x:20,y:0,w:380,h:100,terms:{N:T(.12,'b','NEUTRO'),F:T(.8,'b','FASE')}},
  {id:'S',type:'sw',short:'Interruttore',title:'Interruttore',x:190,y:140,w:210,h:120,terms:{a:T(.5,'t','1'),b:T(.5,'b','2')},plate:{x:344,y:122,l:'Parete'}},
  {id:'L',type:'lamp',short:'Lampada',title:'Portalampada',x:190,y:300,w:210,h:90,terms:{B:T(.25,'t','B'),A:T(.75,'t','A')}}
 ],
 controls:['S'],load:['L.A','L.B'],room:'soffitto',
 solution:[['Q.F','S.a','marrone'],['S.b','L.A','marrone'],['Q.N','L.B','blu']],
 hints:['Parti dalla fase: dal quadro va all’interruttore, non direttamente alla lampada.','Dall’altro morsetto dell’interruttore il filo va a un morsetto della lampada.','Il neutro (blu) va dal quadro all’altro morsetto della lampada, senza passare dall’interruttore.']},
{n:3,name:'Deviato',title:'Punto luce deviato',
 goal:'Comanda la stessa lampada da due punti con due deviatori. Premendo uno qualsiasi dei due, la luce deve cambiare.',
 loadName:'La lampada',
 comps:[
  {id:'Q',type:'quadro',short:'Quadro',title:'Quadro elettrico',x:20,y:0,w:380,h:100,terms:{N:T(.12,'b','NEUTRO'),F:T(.8,'b','FASE')}},
  {id:'D1',type:'dev',short:'Deviatore A',title:'Deviatore A',x:190,y:140,w:210,h:115,terms:{C:T(.5,'t','C'),'1':T(.28,'b','1'),'2':T(.72,'b','2')},plate:{x:56,y:122,l:'Ingresso'}},
  {id:'D2',type:'dev',flip:true,short:'Deviatore B',title:'Deviatore B',x:190,y:290,w:210,h:115,terms:{'1':T(.28,'t','1'),'2':T(.72,'t','2'),C:T(.5,'b','C')},plate:{x:344,y:122,l:'Fondo'}},
  {id:'L',type:'lamp',short:'Lampada',title:'Portalampada',x:190,y:440,w:210,h:90,terms:{B:T(.25,'t','B'),A:T(.75,'t','A')}}
 ],
 controls:['D1','D2'],load:['L.A','L.B'],room:'soffitto',
 solution:[['Q.F','D1.C','marrone'],['D1.1','D2.1','nero'],['D1.2','D2.2','grigio'],['D2.C','L.A','marrone'],['Q.N','L.B','blu']],
 hints:['La fase entra nel morsetto C (comune) del primo deviatore.','I morsetti 1 e 2 del primo deviatore vanno a 1 e 2 del secondo: 1 con 1 e 2 con 2.','Il comune C del secondo deviatore va alla lampada. Il neutro va dal quadro alla lampada, senza passare dai deviatori.']},
{n:4,name:'Invertito',title:'Punto luce invertito',
 goal:'Aggiungi un terzo punto di comando in mezzo, con l’invertitore. Premendo uno qualsiasi dei tre, la luce deve cambiare.',
 loadName:'La lampada',
 comps:[

function buildFull(base){
  const lv=JSON.parse(JSON.stringify(base));
  const pos=base.n===1?{F:.08,PE:.28,N:.48}:{N:.08,F:.28,PE:.48};
  const nm={F:'FASE',N:'NEUTRO',PE:'TERRA'};
  const K={id:'K',type:'cont',short:'Contatore',title:'Contatore',x:20,y:0,w:380,h:96,terms:{}};
  const Q={id:'Q',type:'quadro',full:true,bx:.78,short:'Quadro',title:'Quadro elettrico',x:20,y:140,w:380,h:130,terms:{}};
  Object.keys(pos).forEach(k=>{
    K.terms[k]=T(pos[k],'b',nm[k],nm[k]);
    Q.terms[k+'i']=T(pos[k],'t',nm[k],nm[k]+' (ingresso)');
    if(k!=='PE'||base.n===1)Q.terms[k]=T(pos[k],'b',nm[k],nm[k]+' (uscita)');
  });
  const others=lv.comps.filter(c=>c.id!=='Q');
  const shift=(Q.y+Q.h+44)-Math.min(...others.map(c=>c.y));
  others.forEach(c=>c.y+=shift);
  lv.comps=[K,Q].concat(others);
  lv.src={F:'K.F',N:'K.N',PE:'K.PE'};lv.full=true;
  lv.solution=[['K.F','Q.Fi','marrone'],['K.N','Q.Ni','blu'],['K.PE','Q.PEi','gv']].concat(base.solution);
  if(lv.earth)lv.earth=['K.PE',lv.earth[1]];else lv.mustEarth=['K.PE','Q.PEi'];
  lv.hints=['Parti dal contatore: la fase (marrone) va al morsetto FASE in alto sul quadro, il neutro (blu) al NEUTRO, la terra (giallo-verde) alla TERRA. Sono i morsetti in ingresso, quelli in alto.'].concat(base.hints);
  lv.goal=base.goal+' Parti dal contatore: collega anche i tre fili che portano la corrente fino al quadro.';
  return lv;
}
function makeUF(){const p={};function f(x){if(p[x]===undefined)p[x]=x;while(p[x]!==x){p[x]=p[p[x]];x=p[x];}return x}function u(a,b){p[f(a)]=f(b)}return{f,u}}
function contacts(c,st){
  if(c.type==='quadro')return c.full?[['Fi','F'],['Ni','N'],['PEi','PE']]:[];
  if(c.type==='sw')return st?[['a','b']]:[];
  if(c.type==='dev')return [['C',st?'2':'1']];
  if(c.type==='inv')return st?[['1','4'],['2','3']]:[['1','3'],['2','4']];
  return [];
}
function sim(lv,wires,states){
  const uf=makeUF();
  wires.forEach(w=>uf.u(w.a,w.b));
  lv.comps.forEach(c=>contacts(c,states[c.id]||0).forEach(([a,b])=>uf.u(c.id+'.'+a,c.id+'.'+b)));
  return uf;
}
function analyse(lv,wires,states){
  const uf=sim(lv,wires,states);
  const sr=SRC(lv);const F=uf.f(sr.F),N=uf.f(sr.N),PE=uf.f(sr.PE);
  let fault=null;
  if(F===N)fault='corto';else if(F===PE)fault='faseterra';
  const a=uf.f(lv.load[0]),b=uf.f(lv.load[1]);
  const lit=!fault&&((a===F&&b===N)||(a===N&&b===F));
  return{uf,F,N,PE,fault,lit,a,b};
}
function tname(lv,tid){
  const [cid,id]=tid.split('.');const c=lv.comps.find(k=>k.id===cid);
  return c.short+' · '+(c.terms[id].n||c.terms[id].l);
}
function evaluate(lv,wires){
  const ctl=lv.controls,combos=[];
  for(let m=0;m<(1<<ctl.length);m++){const st={};ctl.forEach((id,i)=>st[id]=(m>>i)&1);combos.push(st);}
  const res=combos.map(st=>analyse(lv,wires,st));
  const out={work:{ok:false,msgs:[]},color:{ok:false,msgs:[]},safe:{ok:false,msgs:[]}};
  const name=id=>{const c=lv.comps.find(k=>k.id===id);const t=c.short[0].toLowerCase()+c.short.slice(1);return (c.type==='dev'?'Il ':'L\u2019')+t;};
  if(!wires.length){
    out.work.msgs.push('Non hai ancora collegato nessun filo.');
    out.color.msgs.push('Collega prima qualche filo.');
    out.safe.msgs.push('Si controlla quando il circuito funziona.');
    out.stars=0;out.pass=false;return out;
  }
  /* funziona */
  const faults=res.filter(r=>r.fault);
  if(faults.length){
    out.work.msgs.push(faults[0].fault==='corto'?'Cortocircuito: la fase arriva al neutro attraverso i fili. Il magnetotermico scatta.':'La fase è finita sul filo di terra: scatta il differenziale.');
  }else if(!ctl.length){
    if(res[0].lit){out.work.ok=true;out.work.msgs.push('Dai corrente: la lampada si accende.');}
    else{
      const r=res[0];
      const anyF=r.a===r.F||r.b===r.F,anyN=r.a===r.N||r.b===r.N;
      if(!anyF)out.work.msgs.push('Alla presa non arriva la fase.');
      if(!anyN)out.work.msgs.push('Alla presa non arriva il neutro.');
      if(anyF&&anyN)out.work.msgs.push('Fase e neutro arrivano alla presa, ma non ai morsetti giusti.');
    }
  }else{
    const anyLit=res.some(r=>r.lit);
    if(!anyLit){
      const anyF=res.some(r=>r.a===r.F||r.b===r.F),anyN=res.some(r=>r.a===r.N||r.b===r.N);
      out.work.msgs.push(lv.loadName+' non si accende mai.');
      if(!anyF)out.work.msgs.push('Alla lampada non arriva mai la fase.');
      if(!anyN)out.work.msgs.push('Alla lampada non arriva il neutro.');
    }else{
      let allGood=true;
      ctl.forEach((id,i)=>{
        let flips=0;
        combos.forEach((st,m)=>{if(res[m].lit!==res[m^(1<<i)].lit)flips++;});
        if(flips===0){allGood=false;out.work.msgs.push(name(id)+' non comanda la lampada: cambiarlo non cambia niente.');}
        else if(flips<combos.length){allGood=false;out.work.msgs.push(name(id)+' comanda la lampada solo con alcune posizioni degli altri comandi.');}
      });
      if(allGood){out.work.ok=true;out.work.msgs.push('Ogni comando cambia la luce, in qualunque posizione si trovino gli altri.');}
    }
  }
  /* colori */
  const uw=makeUF();wires.forEach(w=>uw.u(w.a,w.b));lv.comps.filter(c=>c.type==='quadro').forEach(c=>contacts(c,0).forEach(([a,b])=>uw.u(c.id+'.'+a,c.id+'.'+b)));
  const sr2=SRC(lv);const Fn=uw.f(sr2.F),Nn=uw.f(sr2.N),Pn=uw.f(sr2.PE);
  const bad=[];
  wires.forEach(w=>{
    const k=uw.f(w.a);let role='fase';
    if(k===Nn&&k!==Fn)role='neutro';else if(k===Pn&&k!==Fn)role='terra';
    const okc=role==='neutro'?['blu']:role==='terra'?['gv']:PHASE_OK;
    if(!okc.includes(w.c)){
      const need=role==='neutro'?'blu':role==='terra'?'giallo-verde':'marrone, nero o grigio';
      const rn=role==='neutro'?'del neutro':role==='terra'?'di terra':'di fase';
      bad.push('Il filo '+tname(lv,w.a)+' → '+tname(lv,w.b)+' è un filo '+rn+': deve essere '+need+'.');
    }
  });
  if(!bad.length){out.color.ok=true;out.color.msgs.push(lv.earth?'Fase, neutro e terra hanno i colori giusti.':'Il blu è solo sul neutro, gli altri fili hanno colori da fase.');}
  else{out.color.msgs=bad.slice(0,3);if(bad.length>3)out.color.msgs.push('E altri '+(bad.length-3)+' fili con il colore sbagliato.');}
  /* sicurezza */
  if(!out.work.ok){out.safe.msgs.push('Si controlla quando il circuito funziona.');}
  else{
    const r0=res[0];let ok=true;
    if(lv.full&&(r0.uf.f('Q.Fi')===r0.N||r0.uf.f('Q.Ni')===r0.F)){ok=false;out.safe.msgs.push('Fase e neutro sono invertiti tra contatore e quadro.');}
    if(lv.earth){
      if(r0.uf.f(lv.earth[1])!==r0.uf.f(lv.earth[0])){ok=false;out.safe.msgs.push('La presa non ha il filo di terra: se un apparecchio si guasta, la carcassa può andare in tensione.');}
      if(r0.uf.f(lv.pol)!==r0.F){ok=false;out.safe.msgs.push('Fase e neutro sono invertiti sulla presa: L deve andare alla fase.');}
    }else{
      const alwaysN=lv.load.some(t=>res.every(r=>r.uf.f(t)===r.N));
      if(!alwaysN){ok=false;out.safe.msgs.push('Hai fatto passare il neutro dai comandi. Spenta la luce, i morsetti della lampada restano in tensione. L\u2019interruttore va sulla fase.');}
    }
    if(lv.mustEarth&&r0.uf.f(lv.mustEarth[0])!==r0.uf.f(lv.mustEarth[1])){ok=false;out.safe.msgs.push('Il quadro non è collegato alla terra: manca il filo giallo-verde che arriva dal contatore.');}
    if(ok){out.safe.ok=true;out.safe.msgs.push(lv.earth?'Terra collegata, fase e neutro al posto giusto.':(lv.full?'Il neutro arriva sempre alla lampada e il quadro è collegato a terra.':'Il neutro arriva sempre alla lampada: i comandi interrompono solo la fase.'));}
  }
  out.stars=(out.work.ok?1:0)+(out.color.ok?1:0)+(out.safe.ok?1:0);
  out.pass=out.stars===3;
  return out;
}

function wirePath(p1,p2){
  if(p1.s==='b'&&p2.s==='t'&&p2.y-p1.y>200){
    const yv=p2.y-40;
    return `M${p1.x} ${p1.y} L${p1.x} ${yv} C${p1.x} ${yv+26} ${p2.x} ${p2.y-40} ${p2.x} ${p2.y}`;
  }
  if(p2.s==='b'&&p1.s==='t'&&p1.y-p2.y>200)return wirePath(p2,p1);
  const s1=p1.s==='t'?-1:1,s2=p2.s==='t'?-1:1,d=Math.max(36,Math.abs(p2.y-p1.y)*.45);
  return `M${p1.x} ${p1.y} C${p1.x} ${p1.y+s1*d} ${p2.x} ${p2.y+s2*d} ${p2.x} ${p2.y}`;
}

function schem(c,cur,live,lit){
  const w=c.w,h=c.h,L=t=>live(c.id+'.'+t),st=ST()[c.id]?1:0;let s='';
  if(c.type==='quadro'){

    const stt=POWER?'ACCESO':TRIP?'SCATTATO':'SPENTO';
    if(c.full){[['Fi','F'],['Ni','N'],['PEi','PE']].forEach(([i,o])=>{if(c.terms[i]&&c.terms[o]){const x=w*c.terms[i].f;s+=ln(x,22,x,h-22,L(i));}});}
    s+=`<g class="brk" data-q="1" role="button" tabindex="0" aria-label="Magnetotermico"><rect x="${bx-34}" y="6" width="68" height="56" fill="transparent"/><rect class="hs" x="${bx-26}" y="8" width="52" height="50" rx="5"/><rect class="slotr" x="${bx-8}" y="13" width="16" height="40" rx="3"/><rect class="knob" x="${bx-10}" y="${ky}" width="20" height="16" rx="3"/><circle class="led ${tr}" cx="${bx+18}" cy="16" r="3.2"/></g>`;
    if(c.full)s+=`<text class="lbl" x="${bx}" y="80" text-anchor="middle" style="font-size:10px;fill:var(--ink2)">${stt}</text><text class="lbl" x="${bx}" y="94" text-anchor="middle" style="font-size:10px;fill:var(--ink2)">MAGNETOTERMICO</text>`;
    else s+=`<text class="lbl" x="${bx-60}" y="38" text-anchor="end" style="font-size:10px;fill:var(--ink2)">${stt}</text>`;
  }
  if(c.type==='cont'){
    Object.keys(c.terms).forEach(k=>{const x=w*c.terms[k].f;s+=ln(x,32,x,h-22,L(k));});
    s+=`<text class="lbl" x="${w-14}" y="17" text-anchor="end" style="font-size:10px;fill:var(--ink2)">DALLA RETE 230 V</text>`;
    s+=`<rect x="${w*.58}" y="28" width="${w*.36}" height="40" rx="5" fill="#16231C" stroke="var(--comp-edge)"/><text id="kwh" x="${w*.76}" y="54" text-anchor="middle" style="font:500 15px 'IBM Plex Mono',monospace;fill:#8FE3AE">${kwhTxt()}</text><circle class="led ${POWER?'on blink':''}" cx="${w*.58+10}" cy="38" r="3"/>`;
  }
  if(c.type==='sw'){
    const x=w/2;
    s+=ln(x,22,x,52,L('a'))+ln(x,74,x,h-22,L('b'));
    s+=dot(x,52)+dot(x,74);
    s+=st?ln(x,52,x,74,L('a')&&L('b')):ln(x,52,x+16,66,false);
  }
  if(c.type==='dev'){
    const g=c.flip?`transform="translate(0,${h}) scale(1,-1)"`:'';
    const y2=h-22-(c.flip?0:0);
    s+=`<g ${g}>`+ln(w/2,22,w/2,46,L('C'))+ln(w*.28,72,w*.28,y2,L('1'))+ln(w*.72,72,w*.72,y2,L('2'))+dot(w/2,46)+dot(w*.28,72)+dot(w*.72,72);
    const tx=st?w*.72:w*.28,tl=L('C')&&L(st?'2':'1');
    s+=ln(w/2,46,tx,72,tl)+`</g>`;
  }
  if(c.type==='inv'){
    const a=w*.28,b=w*.72,y1=22,y2=h-22;
    const straight=!st,t1=L('1'),t2=L('2');
    s+=ln(a,y1,a,y2,straight&&t1,!straight)+ln(b,y1,b,y2,straight&&t2,!straight);
    s+=ln(a,y1,b,y2,!straight&&t1,straight)+ln(b,y1,a,y2,!straight&&t2,straight);
  }
  if(c.type==='lamp'){
    const cx=w/2,cy=58;
    s+=ln(w*.25,22,w*.25,cy,L('B'))+ln(w*.25,cy,cx-16,cy,L('B'))+ln(w*.75,22,w*.75,cy,L('A'))+ln(w*.75,cy,cx+16,cy,L('A'));
    s+=`<circle class="bulb${lit?' on':''}" cx="${cx}" cy="${cy}" r="16"/><path d="M${cx-9} ${cy-9} L${cx+9} ${cy+9} M${cx+9} ${cy-9} L${cx-9} ${cy+9}" stroke="${lit?'#7A4A00':'var(--sch)'}" stroke-width="2" fill="none"/>`;
  }
  if(c.type==='presa'){
    const cx=w/2,hy=84;
    s+=`<rect class="faceplate" x="${cx-44}" y="54" width="88" height="46" rx="6"/>`;
    s+=ln(w*.2,22,cx-24,54,L('L'))+ln(w*.5,22,cx,54,L('PE'))+ln(w*.8,22,cx+24,54,L('N'));
    [[-24],[0],[24]].forEach(([d],i)=>{s+=`<circle class="hole" cx="${cx+d}" cy="${hy}" r="${i===1?4:5}"/>`});
    s+=`<text class="lbl" x="${cx}" y="${h-6}" text-anchor="middle" style="font-size:10px;fill:var(--ink2)">VISTA DA DIETRO</text>`;
  }
  return s;
}
function termSVG(c,id,cur){
  const p=tpos(c,id),tid=c.id+'.'+id,t=c.terms[id];
  const rot=((tid.charCodeAt(0)*37+tid.charCodeAt(tid.length-1)*17)%160)-20;
  const m=MQ.matches,lx=p.x+(m?19:16);
  return `<g class="term${SEL===tid?' sel':''}" data-term="${tid}" transform="translate(${p.x},${p.y})" role="button" tabindex="0" aria-label="Morsetto ${c.short} ${t.l}"><circle class="hit" r="${m?26:20}"/><circle class="halo" r="${m?18.5:15.5}"/><circle class="screw" r="${m?13:10.5}"/><line class="slot" x1="${MQ.matches?-8:-6}" y1="0" x2="${MQ.matches?8:6}" y2="0" transform="rotate(${rot})"/></g><text class="lbl" x="${lx}" y="${p.y+4.5}">${t.l}</text>`;
}
function renderBench(){
  const lv=LV(),cur=CUR();
  const live=id=>POWER&&cur.uf.f(id)===cur.F;
  const lit=POWER&&cur.lit;
  const H=Math.max(...lv.comps.map(c=>c.y+c.h))+22;
  const b=$('#bench');b.setAttribute('viewBox',`10 -28 400 ${H+28}`);
  let s=`<defs><pattern id="pegs" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1.4" fill="var(--dot)"/></pattern></defs><rect x="0" y="-28" width="420" height="${H+28}" fill="var(--bench)"/><rect x="0" y="-28" width="420" height="${H+28}" fill="url(#pegs)"/>`;
  lv.comps.forEach(c=>{
    s+=`<text class="ttl" x="${c.x+2}" y="${c.y-9}">${c.title}</text>`;
    s+=`<g class="help" data-help="${c.type}" role="button" tabindex="0" aria-label="Che cos’è: ${c.title}"><circle cx="${c.x+c.w-12}" cy="${c.y-13}" r="19" fill="transparent" stroke="none"/><circle cx="${c.x+c.w-9}" cy="${c.y-13}" r="${MQ.matches?11:9}"/><text x="${c.x+c.w-9}" y="${c.y-8.5}" text-anchor="middle">?</text></g>`;
    s+=`<rect class="body" x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" rx="10"/>`;
    s+=`<g transform="translate(${c.x},${c.y})"${c.type==='sw'||c.type==='dev'||c.type==='inv'?` class="togg" data-ctl="${c.id}" style="cursor:pointer"`:''}>${(c.type==='sw'||c.type==='dev'||c.type==='inv')?`<rect x="0" y="0" width="${c.w}" height="${c.h}" rx="10" fill="transparent"/>`:''}${schem(c,cur,live,lit)}</g>`;
  });
  if(GHOST)s+=lv.solution.map(([a,bb,col])=>{const q=COLORS[col];return `<path class="ghost" d="${wirePath(tp(a),tp(bb))}" stroke="${q.dash?q.base:q.base}"/>`}).join('');
  W().forEach(w=>{
    const d=wirePath(tp(w.a),tp(w.b)),q=COLORS[w.c];
    const fl=POWER&&cur.uf.f(w.a)===cur.F?'f':POWER&&cur.uf.f(w.a)===cur.N?'n':'';
    s+=`<g data-wire="${w.id}"><path class="w-hit" d="${d}"/><path class="w-edge" d="${d}"/><path class="w-col" d="${d}" stroke="${q.base}"/>${q.dash?`<path class="w-col dash" d="${d}" stroke="${q.dash}"/>`:''}${fl?`<path class="flow ${fl}" d="${d}"/>`:''}</g>`;
  });
  lv.comps.forEach(c=>{Object.keys(c.terms).forEach(id=>{s+=termSVG(c,id,cur)})});
  s+=`<path id="prev" d=""/>`;
  b.innerHTML=s;
}
function renderStatus(){
  const cur=CUR(),lit=POWER&&cur.lit;
  const q=POWER?['Quadro acceso','ok']:TRIP?['Quadro scattato','bad']:['Quadro spento',''];
  $('#status').innerHTML=`<span class="pill ${q[1]}">${q[0]}</span><span class="pill${lit?' on':''}">${LV().room==='tavolo'?'Lampada':'Luce'} ${lit?'accesa':'spenta'}</span><span class="msg" aria-live="polite">${MSG}</span>`;
  updateRoom(lit);
}
function renderResult(){
  const el=$('#result'),r=RESULTS[KEY()];
  if(!r){el.innerHTML=`<h3>Controllo del circuito</h3><p class="muted">Quando hai collegato i fili, premi <b>Verifica</b>. Ti diciamo se funziona, se i colori sono giusti e se l’impianto è sicuro.</p>`;return}
  const row=(t,o)=>`<div class="row"><span class="mark ${o.ok?'ok':o.msgs[0]&&o.msgs[0].startsWith('Si controlla')?'na':'ko'}" aria-hidden="true">${o.ok?'✓':o.msgs[0]&&o.msgs[0].startsWith('Si controlla')?'–':'✕'}</span><div><b>${t}</b><ul>${o.msgs.map(m=>`<li>${m}</li>`).join('')}</ul></div></div>`;
  const last=LI===LEVELS.length-1;
  el.innerHTML=`<h3>${r.pass?'Livello superato':'Controllo del circuito'}</h3><div class="stars" aria-label="${r.stars} stelle su 3">${'★'.repeat(r.stars)}<span class="e">${'★'.repeat(3-r.stars)}</span></div>${row('Funziona',r.work)}${row('Colori dei fili',r.color)}${row('Sicurezza',r.safe)}${r.pass?(last?`<p class="next"><b>Hai completato tutti i livelli.</b></p>`:`<div class="next"><button class="btn primary" id="bNext" style="margin-left:0">Livello successivo</button></div>`):''}`;
}
function renderAll(){renderBench();renderStatus();renderResult()}
function loadLevel(i){
  LI=i;SEL=null;GHOST=false;HINT=-1;POWER=false;TRIP=false;MSG='';
  const lv=LV();
  $('#kick').textContent='Livello '+lv.n+' di '+LEVELS.length+(MODE==='contatore'?' \u00b7 dal contatore':'');
  $('#lvName').textContent=lv.title;$('#lvGoal').textContent=lv.goal;
  $('#bSol').textContent='Mostra soluzione';$('#bSol').setAttribute('aria-pressed','false');
  buildRoom();setInfo('morsetto',null,false);renderLevels();renderAll();
}

/* ---------- logica di gioco ---------- */
function applyLive(){
  const cur=CUR();
  if(POWER&&cur.fault){
    POWER=false;TRIP=true;
    MSG=cur.fault==='corto'?'Il magnetotermico è scattato: la fase tocca il neutro (cortocircuito).':'È scattato il differenziale: la fase è finita sul filo di terra.';
  }
}
function wiresChanged(){
  RESULTS[KEY()]=null;
  if(POWER){POWER=false;MSG='Per sicurezza il quadro si è spento: non si toccano i fili con la corrente.';}
  else if(TRIP){TRIP=false;MSG='';}
  else MSG='';
}
function addWire(a,b){
  if(!a||!b||a===b)return;
  const ws=W();const k=ws.findIndex(w=>(w.a===a&&w.b===b)||(w.a===b&&w.b===a));
  wiresChanged();
  if(k>=0)ws.splice(k,1);else ws.push({id:WID++,a,b,c:COL});
  buzz();renderAll();
}
function toggleBreaker(){
  if(POWER){POWER=false;MSG='Quadro spento.';}
  else{
    POWER=true;TRIP=false;MSG='';
    applyLive();
    if(POWER)MSG=CUR().lit?'':'Il quadro è acceso ma la lampada resta spenta.';
  }
  renderAll();
}
function toggleCtl(id){
  const st=ST();st[id]=st[id]?0:1;MSG='';
  applyLive();
  if(POWER&&!CUR().lit&&!TRIP)MSG='';
  renderAll();
}
function svgPt(e){
  const b=$('#bench'),pt=b.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
  return pt.matrixTransform(b.getScreenCTM().inverse());
}
function clearSel(){
  SEL=null;document.querySelectorAll('.term.sel').forEach(n=>n.classList.remove('sel'));
  const p=$('#prev');if(p)p.setAttribute('d','');
}
let dragging=false,moved=false,downPt=null,reselect=false;
const bench=$('#bench');
function hidePrev(){const p=$('#prev');if(p)p.setAttribute('d','')}
bench.addEventListener('pointerdown',e=>{
  dragging=false;
  const t=e.target.closest('[data-term]');
  if(!t)return;
  const id=t.dataset.term;
  if(SEL&&SEL!==id){const a=SEL;clearSel();addWire(a,id);return}
  reselect=(SEL===id);
  clearSel();SEL=id;dragging=true;moved=false;downPt={x:e.clientX,y:e.clientY};
  t.classList.add('sel');
});
window.addEventListener('pointermove',e=>{
  if(!SEL)return;
  if(dragging&&downPt&&Math.hypot(e.clientX-downPt.x,e.clientY-downPt.y)>10)moved=true;
  if(e.pointerType!=='mouse'&&!dragging)return;
  const p=$('#prev');if(!p)return;
  const a=tp(SEL),q=svgPt(e);
  p.setAttribute('d',`M${a.x} ${a.y} L${q.x} ${q.y}`);
});
window.addEventListener('pointerup',e=>{
  if(!dragging)return;dragging=false;
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const t=el&&el.closest?el.closest('[data-term]'):null;
  if(SEL&&t&&t.dataset.term!==SEL){const a=SEL;clearSel();addWire(a,t.dataset.term);}
  else if(SEL&&t&&t.dataset.term===SEL&&reselect&&!moved){clearSel();}
  else hidePrev();
});
window.addEventListener('pointercancel',()=>{dragging=false;hidePrev()});
bench.addEventListener('click',e=>{
  const t=e.target.closest('[data-term]');
  if(t)return;
  const h=e.target.closest('[data-help]');if(h){setInfo(h.dataset.help);return}
  const q=e.target.closest('[data-q]');if(q){clearSel();toggleBreaker();return}
  const c=e.target.closest('[data-ctl]');if(c){clearSel();toggleCtl(c.dataset.ctl);return}
  const w=e.target.closest('[data-wire]');if(w){clearSel();const id=+w.dataset.wire;const ws=W();const k=ws.findIndex(x=>x.id===id);if(k>=0){wiresChanged();ws.splice(k,1);renderAll();}return}
  clearSel();
});
bench.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  const t=e.target.closest('[data-term]');
  if(t){e.preventDefault();const id=t.dataset.term;if(SEL&&SEL!==id){const a=SEL;clearSel();addWire(a,id);}else{clearSel();SEL=id;t.classList.add('sel');}return}
  const q=e.target.closest('[data-q]');if(q){e.preventDefault();toggleBreaker();return}
  const h=e.target.closest('[data-help]');if(h){e.preventDefault();setInfo(h.dataset.help);}
});
$('#room').addEventListener('click',e=>{const c=e.target.closest('[data-ctl]');if(c)toggleCtl(c.dataset.ctl)});
$('#room').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const c=e.target.closest('[data-ctl]');if(c){e.preventDefault();toggleCtl(c.dataset.ctl)}}});
document.querySelector('.mode').addEventListener('click',e=>{
  const b=e.target.closest('[data-mode]');if(!b||b.dataset.mode===MODE)return;
  MODE=b.dataset.mode;document.querySelectorAll('.seg').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.mode===MODE)));
  loadLevel(LI);renderResult();
});
setInterval(()=>{if(POWER&&CUR().lit){KWH+=0.1;const k=$('#kwh');if(k)k.textContent=kwhTxt();}},700);
$('#info').addEventListener('click',e=>{if(e.target.closest('[data-x]'))$('#info').classList.remove('open')});
if(window.ResizeObserver){new ResizeObserver(()=>{document.documentElement.style.setProperty('--roomH',Math.ceil($('.roomcard').getBoundingClientRect().height)+8+'px')}).observe($('.roomcard'))}
const onMQ=()=>{setRoomVB();renderBench();if(!MQ.matches)$('#info').classList.add('open')};
if(MQ.addEventListener)MQ.addEventListener('change',onMQ);
$('#palette').addEventListener('click',e=>{const b=e.target.closest('[data-col]');if(b){COL=b.dataset.col;renderPalette()}});
$('#levels').addEventListener('click',e=>{const b=e.target.closest('[data-lv]');if(b){loadLevel(+b.dataset.lv);renderResult()}});
$('#bUndo').addEventListener('click',()=>{if(W().length){wiresChanged();W().pop();renderAll()}});
$('#bClear').addEventListener('click',()=>{if(W().length){wiresChanged();WIRES[KEY()]=[];STATES[KEY()]={};renderAll()}});
$('#bHint').addEventListener('click',setHint);
$('#bSol').addEventListener('click',()=>{GHOST=!GHOST;$('#bSol').textContent=GHOST?'Nascondi soluzione':'Mostra soluzione';$('#bSol').setAttribute('aria-pressed',String(GHOST));renderBench()});
$('#bCheck').addEventListener('click',()=>{
  const r=evaluate(LV(),W());RESULTS[KEY()]=r;
  const n=PK(LV().n);if((PROG[n]||0)<r.stars){PROG[n]=r.stars;saveProg();renderLevels();}
  renderResult();
  $('#result').scrollIntoView({behavior:'smooth',block:'nearest'});
});
$('#result').addEventListener('click',e=>{if(e.target.id==='bNext'){loadLevel(LI+1);renderResult();window.scrollTo({top:0,behavior:'smooth'})}});

renderPalette();loadLevel(0);renderResult();
</script>

</body></html>
