<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Laboratorio elettrico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
/* Layout: sinistra la stanza con la luce, destra il banco di lavoro con i componenti da cablare */
:root{
  --bg:#EDF1F0; --ink:#17201E; --ink2:#52635F; --card:#FFFFFF; --line:#CDD6D3;
  --bench:#DCE2DF; --dot:#B3BFBB; --comp:#FAFBFA; --comp-edge:#7C8B86; --sch:#667773;
  --metal:#C9D0CD; --metal-edge:#5E6C68; --slot:#2F3B38;
  --accent:#D9480F; --on-accent:#FFFFFF; --ok:#17794A; --bad:#BE2530; --warn:#8F5600;
  --wall:#D3DCE6; --floor:#B99A70; --skirt:#9AA8B6; --shade:#ECE7DA; --bulb-off:#C7CECB;
  --plate:#F4F5F4; --plate-edge:#8A9692; --rkhi:#FFFFFF; --rklo:#B9C2BF;
  --wire-edge:rgba(18,26,24,.55); --breaker:#EEF0EF; --chip:#E7EDEB; --table:#8A6A48;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1514; --ink:#E6EEEC; --ink2:#9DAEA9; --card:#172120; --line:#2B3735;
    --bench:#1D2827; --dot:#2D3B38; --comp:#2B3836; --comp-edge:#6F837E; --sch:#9BADA8;
    --metal:#8F9C98; --metal-edge:#CBD5D2; --slot:#1C2523;
    --accent:#FF7A33; --on-accent:#1A0D05; --ok:#4CC38A; --bad:#FF6B73; --warn:#E8A33A;
    --wall:#2B3543; --floor:#4B4036; --skirt:#3A4655; --shade:#B9B3A4; --bulb-off:#53605D;
    --plate:#C9D0CE; --plate-edge:#6F7C78; --rkhi:#F3F6F5; --rklo:#8E9996;
    --wire-edge:rgba(235,243,241,.6); --breaker:#D9DEDD; --chip:#223130; --table:#5B4630;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0F1514; --ink:#E6EEEC; --ink2:#9DAEA9; --card:#172120; --line:#2B3735;
    --bench:#1D2827; --dot:#2D3B38; --comp:#2B3836; --comp-edge:#6F837E; --sch:#9BADA8;
    --metal:#8F9C98; --metal-edge:#CBD5D2; --slot:#1C2523;
    --accent:#FF7A33; --on-accent:#1A0D05; --ok:#4CC38A; --bad:#FF6B73; --warn:#E8A33A;
    --wall:#2B3543; --floor:#4B4036; --skirt:#3A4655; --shade:#B9B3A4; --bulb-off:#53605D;
    --plate:#C9D0CE; --plate-edge:#6F7C78; --rkhi:#F3F6F5; --rklo:#8E9996;
    --wire-edge:rgba(235,243,241,.6); --breaker:#D9DEDD; --chip:#223130; --table:#5B4630;
    color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;padding-inline:16px;padding-block:14px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:'Barlow Condensed','Barlow',system-ui,sans-serif;font-weight:600;margin:0;letter-spacing:.01em}
h1{font-size:26px;line-height:1.1}
h2{font-size:24px;line-height:1.15}
p{margin:0}
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.levels{display:flex;flex-wrap:wrap;gap:8px}
.lv{font:500 15px/1.1 'Barlow',system-ui,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:92px}
.lv small{font:500 13px/1 'IBM Plex Mono',ui-monospace,monospace;color:var(--ink2);letter-spacing:.05em}
.lv[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.lv:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media (min-width:920px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}.left{position:sticky;top:12px}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.kicker{font:500 12px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.goal p{color:var(--ink2);margin-top:6px;max-width:62ch}
.roomcard{padding:0;overflow:hidden}
#room{display:block;width:100%;height:auto}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.pill{font:500 13px/1 'IBM Plex Mono',ui-monospace,monospace;padding:6px 9px;border-radius:6px;background:var(--chip);color:var(--ink)}
.pill.on{background:#FFD25E;color:#2A1B00}
.pill.bad{background:var(--bad);color:#fff}
.pill.ok{background:var(--ok);color:#fff}
.msg{flex-basis:100%;font-size:15px;color:var(--ink2);min-height:22px}
.info h3{font:600 17px/1.2 'Barlow Condensed',sans-serif;margin:0 0 4px;letter-spacing:.02em}
.info p{color:var(--ink2);max-width:62ch}
.mode{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mlabel{font:500 13px/1 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.mlabel.hint{text-transform:none;letter-spacing:0;font:400 14px/1.2 'Barlow',sans-serif}
.led.blink{animation:blink 1.4s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.25}}
.palette{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{display:flex;align-items:center;gap:8px;font:500 14px/1 'Barlow',sans-serif;background:var(--chip);color:var(--ink);border:1px solid transparent;border-radius:999px;padding:7px 12px 7px 8px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sw{width:30px;height:12px;border-radius:6px;border:1px solid var(--wire-edge);display:block}
.tip{font-size:14px;color:var(--ink2);margin-bottom:8px}
#bench{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button.btn{font:500 15px/1 'Barlow',sans-serif;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:11px 14px;cursor:pointer}
button.btn:hover{border-color:var(--comp-edge)}
button.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600;margin-left:auto}
.res h3{font:600 20px/1.2 'Barlow Condensed',sans-serif;margin:0 0 8px}
.stars{font-size:26px;letter-spacing:4px;color:#F2A900;line-height:1}
.stars .e{color:var(--line)}
.row{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 8px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.mark{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 14px/1 'IBM Plex Mono',monospace;color:#fff}
.mark.ok{background:var(--ok)}.mark.ko{background:var(--bad)}.mark.na{background:var(--comp-edge)}
.row b{font-weight:600}
.row ul{margin:2px 0 0;padding-left:18px;color:var(--ink2);font-size:15px}
.next{margin-top:10px}
.muted{color:var(--ink2)}

/* banco di lavoro */
.ttl{font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;fill:var(--ink2)}
.lbl{font:500 11px 'IBM Plex Mono',monospace;fill:var(--ink);pointer-events:none}
.body{fill:var(--comp);stroke:var(--comp-edge);stroke-width:1.5}
.help{cursor:pointer}.help circle{fill:var(--chip);stroke:var(--comp-edge)}.help text{font:600 12px 'Barlow',sans-serif;fill:var(--ink)}
.cl{stroke:var(--sch);stroke-width:2.6;fill:none;stroke-linecap:round}
.cl.on{stroke:#F59F00}.cl.off{stroke-dasharray:3 5;opacity:.45}
.ct{fill:var(--comp);stroke:var(--sch);stroke-width:2}
.hole{fill:var(--slot)}
.faceplate{fill:var(--plate);stroke:var(--plate-edge);stroke-width:1.2}
.term{cursor:pointer;touch-action:none}
.term .hit{fill:transparent}
.term .halo{fill:none;stroke:var(--accent);stroke-width:3;opacity:0}
.term:hover .halo{opacity:.55}
.term.sel .halo{opacity:1;animation:pulse 1s ease-in-out infinite}
.screw{fill:var(--metal);stroke:var(--metal-edge);stroke-width:1.6}
.slot{stroke:var(--slot);stroke-width:2.4;stroke-linecap:round}
@keyframes pulse{50%{stroke-width:6}}
.w-hit{fill:none;stroke:transparent;stroke-width:18;cursor:pointer}
.w-edge{fill:none;stroke:var(--wire-edge);stroke-width:9;stroke-linecap:round;pointer-events:none}
.w-col{fill:none;stroke-width:5.5;stroke-linecap:round;pointer-events:none}
.w-col.dash{stroke-dasharray:9 9}
.flow{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:1 12;animation:fl .9s linear infinite;pointer-events:none}
.flow.f{stroke:#FFE08A}.flow.n{stroke:#D7EEFF}
@keyframes fl{to{stroke-dashoffset:-13}}
.ghost{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:3 9;opacity:.8;pointer-events:none}
#prev{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:6 6;pointer-events:none}
.brk{cursor:pointer}
.brk .hs{fill:var(--breaker);stroke:var(--comp-edge);stroke-width:1.5}
.brk .slotr{fill:var(--slot)}
.brk .knob{fill:#fff;stroke:var(--metal-edge);stroke-width:1.4;transition:transform .15s}
.led{fill:var(--comp-edge)}.led.on{fill:#2BD17E}.led.trip{fill:#FF4B55}
/* stanza */
.wall{fill:var(--wall)}.floor{fill:var(--floor)}.skirt{fill:var(--skirt)}
.night{fill:#050816;transition:opacity .55s ease}
.glowc{transition:opacity .55s ease}
.bulb{fill:var(--bulb-off);stroke:var(--comp-edge);stroke-width:1.2;transition:fill .3s}
.bulb.on{fill:#FFD25E;stroke:#E8A100}
.shade{fill:var(--shade);stroke:var(--comp-edge);stroke-width:1.2}
.plate{fill:var(--plate);stroke:var(--plate-edge);stroke-width:1.4}
.rk{stroke:var(--plate-edge);stroke-width:1}
.rk.hi{fill:var(--rkhi)}.rk.lo{fill:var(--rklo)}
.pl{cursor:pointer}
.pl text{font:500 12px 'Barlow',sans-serif;fill:#EAF0F8}
@media (prefers-reduced-motion:reduce){.led.blink,.flow,.term.sel .halo{animation:none}.night,.glowc{transition:none}}

.info .x{display:none}
@media (max-width:919px){
  body{padding-block:10px 28px}
  .wrap,.grid{gap:10px}
  .col{display:contents}
  .goal{order:1}.roomcard{order:2}.benchcard{order:3}.res{order:4}
  .top{gap:8px}
  h1{font-size:22px}
  .brand svg{width:26px;height:26px}
  .levels{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:4px;margin-inline:-2px;scrollbar-width:none}
  .levels::-webkit-scrollbar{display:none}
  .lv{flex:none;min-width:88px;padding:9px 12px}
  .card{padding:12px}
  .goal h2{font-size:21px}
  .goal p{font-size:15px;margin-top:4px}
  .roomcard{position:sticky;top:0;z-index:6;padding:0}
  #room{width:100%;height:auto;aspect-ratio:400/108}
  .status{position:absolute;left:8px;right:8px;bottom:6px;padding:0;border:0;gap:6px;pointer-events:none}
  .status .pill{font-size:12px;padding:5px 8px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
  .msg{background:rgba(8,12,20,.82);color:#fff;border-radius:8px;padding:6px 9px;font-size:13px;line-height:1.3;min-height:0;pointer-events:auto}
  .msg:empty{display:none}
  .benchcard{padding:12px 0}
  .benchcard>.mode,.benchcard>.tip,.benchcard>.actions{margin-inline:12px}
  .benchcard>.palette{position:sticky;top:var(--roomH,104px);z-index:5;background:var(--card);margin:0 0 6px;padding:8px 12px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;border-bottom:1px solid var(--line)}
  .chip{flex-direction:column;align-items:stretch;gap:5px;border-radius:10px;padding:6px 4px 6px;font-size:12px;text-align:center;line-height:1.1;overflow-wrap:anywhere}
  .chip .sw{width:100%;height:12px}
  .seg.chip{flex-direction:row;justify-content:center;padding:9px 14px;font-size:14px;border-radius:999px;min-height:40px;align-items:center}
  .mode{gap:6px}
  .mlabel.hint{flex-basis:100%;font-size:13px}
  #bench{border-radius:0;border-inline:0}
  .term .halo{stroke-width:3.5}
  .lbl{font-size:12px}
  .ttl{font-size:14px}
  .w-hit{stroke-width:24px}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  button.btn{min-height:46px;font-size:16px}
  button.btn.primary{grid-column:1/-1;margin-left:0}
  .res{scroll-margin-top:calc(var(--roomH,104px) + 12px)}
  .res h3{font-size:19px}
  .info{display:none}
  .info.open{display:block;position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.35);border-color:var(--comp-edge)}
  .info .x{display:block;float:right;margin:-4px -4px 6px 10px;font:500 14px/1 'Barlow',sans-serif;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-height:40px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="7" fill="var(--accent)"/><path d="M17 5 9 17h6l-2 8 8-12h-6z" fill="var(--on-accent)"/></svg>
      <h1>Laboratorio elettrico</h1>
    </div>
    <nav class="levels" id="levels" aria-label="Livelli"></nav>
  </header>

  <main class="grid">
    <section class="col left" aria-label="Stanza">
      <div class="card goal"><div class="kicker" id="kick"></div><h2 id="lvName"></h2><p id="lvGoal"></p></div>
      <div class="card roomcard">
        <svg id="room" viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stanza con la luce da accendere"></svg>
        <div class="status" id="status"></div>
      </div>
      <div class="card info" id="info"></div>
    </section>

    <section class="col" aria-label="Banco di lavoro">
      <div class="card benchcard">
        <div class="mode" role="group" aria-label="Punto di partenza"><span class="mlabel">Parti dal</span><button class="chip seg" data-mode="quadro" aria-pressed="true">Quadro</button><button class="chip seg" data-mode="contatore" aria-pressed="false">Contatore</button><span class="mlabel hint">il contatore è la versione completa</span></div>
        <div class="palette" id="palette" role="group" aria-label="Colore del filo"></div>
        <p class="tip">Scegli il colore, poi tocca due morsetti per collegarli (o trascina). Tocca un filo per toglierlo. Per provare: dai corrente dal quadro e tocca l’interruttore.</p>
        <svg id="bench" role="img" aria-label="Banco di lavoro con i componenti da collegare"></svg>
        <div class="actions">
          <button class="btn" id="bUndo">Annulla filo</button>
          <button class="btn" id="bClear">Svuota</button>
          <button class="btn" id="bHint">Suggerimento</button>
          <button class="btn" id="bSol" aria-pressed="false">Mostra soluzione</button>
          <button class="btn primary" id="bCheck">Verifica</button>
        </div>
      </div>
      <div class="card res" id="result" aria-live="polite"></div>
    </section>
  </main>
</div>
<script>
(() => {
  // src/engine/wires.js
  var WIRE_COLORS = ["marrone", "nero", "grigio", "blu", "gv"];
  var PHASE_COLORS = ["marrone", "nero", "grigio"];
  function allowedColors(role) {
    if (role === "neutro") return ["blu"];
    if (role === "terra") return ["gv"];
    return PHASE_COLORS;
  }

  // src/engine/components.js
  var COMPONENT_TYPES = {
    // Il quadro, nella versione completa (parte dal contatore), collega ingresso e uscita.
    quadro: {
      contacts: (c2) => c2.full ? [["Fi", "F"], ["Ni", "N"], ["PEi", "PE"]] : []
    },
    cont: { contacts: () => [] },
    presa: { contacts: () => [] },
    lamp: { contacts: () => [] },
    // Interruttore: chiuso (1) collega i due morsetti.
    sw: {
      control: true,
      contacts: (c2, st) => st ? [["a", "b"]] : []
    },
    // Deviatore: il comune C va al morsetto 1 (stato 0) oppure al 2 (stato 1).
    dev: {
      control: true,
      contacts: (c2, st) => [["C", st ? "2" : "1"]]
    },
    // Invertitore: in una posizione collega dritto, nell'altra incrocia.
    inv: {
      control: true,
      contacts: (c2, st) => st ? [["1", "4"], ["2", "3"]] : [["1", "3"], ["2", "4"]]
    }
  };
  function contactsOf(component, state) {
    const t = COMPONENT_TYPES[component.type];
    return t ? t.contacts(component, state) : [];
  }

  // src/engine/circuit.js
  function sourceOf(level) {
    return level.src || { F: "Q.F", N: "Q.N", PE: "Q.PE" };
  }
  function makeUF() {
    const p = {};
    function f(x) {
      if (p[x] === void 0) p[x] = x;
      while (p[x] !== x) {
        p[x] = p[p[x]];
        x = p[x];
      }
      return x;
    }
    function u(a, b) {
      p[f(a)] = f(b);
    }
    return { f, u };
  }
  function connect(level, wires, states) {
    const uf = makeUF();
    wires.forEach((w) => uf.u(w.a, w.b));
    level.comps.forEach(
      (c2) => contactsOf(c2, states[c2.id] || 0).forEach(([a, b]) => uf.u(c2.id + "." + a, c2.id + "." + b))
    );
    return uf;
  }
  function analyse(level, wires, states) {
    const uf = connect(level, wires, states);
    const sr = sourceOf(level);
    const F = uf.f(sr.F), N = uf.f(sr.N), PE = uf.f(sr.PE);
    let fault = null;
    if (F === N) fault = "corto";
    else if (F === PE) fault = "faseterra";
    const a = uf.f(level.load[0]), b = uf.f(level.load[1]);
    const lit = !fault && (a === F && b === N || a === N && b === F);
    return { uf, F, N, PE, fault, lit, a, b };
  }
  function potentialOf(analysis, terminalId) {
    const k = analysis.uf.f(terminalId);
    if (k === analysis.F) return "F";
    if (k === analysis.N) return "N";
    if (k === analysis.PE) return "PE";
    return null;
  }

  // src/engine/evaluate.js
  function section() {
    return { ok: false, status: "ko", items: [] };
  }
  function finish(sec) {
    if (sec.ok) sec.status = "ok";
    else if (sec.items.length && sec.items[0].code === "safe.skipped") sec.status = "na";
    else sec.status = "ko";
  }
  function evaluate(level, wires) {
    const ctl = level.controls;
    const combos = [];
    for (let m = 0; m < 1 << ctl.length; m++) {
      const st = {};
      ctl.forEach((id, i) => st[id] = m >> i & 1);
      combos.push(st);
    }
    const res = combos.map((st) => analyse(level, wires, st));
    const out = { work: section(), color: section(), safe: section() };
    const add = (sec, code, params) => out[sec].items.push(params ? { code, ...params } : { code });
    if (!wires.length) {
      add("work", "work.noWires");
      add("color", "color.noWires");
      add("safe", "safe.skipped");
      out.stars = 0;
      out.pass = false;
      finish(out.work);
      finish(out.color);
      finish(out.safe);
      return out;
    }
    const faults = res.filter((r) => r.fault);
    if (faults.length) {
      add("work", faults[0].fault === "corto" ? "work.short" : "work.phaseToEarth");
    } else if (!ctl.length) {
      if (res[0].lit) {
        out.work.ok = true;
        add("work", "work.socketLit");
      } else {
        const r = res[0];
        const anyF = r.a === r.F || r.b === r.F;
        const anyN = r.a === r.N || r.b === r.N;
        if (!anyF) add("work", "work.noPhaseAtSocket");
        if (!anyN) add("work", "work.noNeutralAtSocket");
        if (anyF && anyN) add("work", "work.wrongSocketTerminals");
      }
    } else {
      const anyLit = res.some((r) => r.lit);
      if (!anyLit) {

    comps2.forEach((c2) => {
      Object.keys(c2.terms).forEach((id) => {
        o += termSVG(c2, id, ui2);
      });
    });
    o += `<path id="prev" d=""/>`;
    return o;
  }
  function statusHTML(s) {
    const q = s.power ? ["Quadro acceso", "ok"] : s.trip ? ["Quadro scattato", "bad"] : ["Quadro spento", ""];
    return `<span class="pill ${q[1]}">${q[0]}</span><span class="pill${s.lit ? " on" : ""}">${s.level.room === "tavolo" ? "Lampada" : "Luce"} ${s.lit ? "accesa" : "spenta"}</span><span class="msg" aria-live="polite">${sessionMessage(s.message)}</span>`;
  }
  var MARK = { ok: "\u2713", na: "\u2013", ko: "\u2715" };
  function resultHTML(s) {
    if (!s.result) {
      return `<h3>Controllo del circuito</h3><p class="muted">Quando hai collegato i fili, premi <b>Verifica</b>. Ti diciamo se funziona, se i colori sono giusti e se l\u2019impianto \xE8 sicuro.</p>`;
    }
    const r = describeEvaluation(s.result, s.level);
    const row = (t, o) => `<div class="row"><span class="mark ${o.status}" aria-hidden="true">${MARK[o.status]}</span><div><b>${t}</b><ul>${o.msgs.map((m) => `<li>${m}</li>`).join("")}</ul></div></div>`;
    const last = s.levelIndex === s.levelCount - 1;
    return `<h3>${r.pass ? "Livello superato" : "Controllo del circuito"}</h3><div class="stars" aria-label="${r.stars} stelle su 3">${"\u2605".repeat(r.stars)}<span class="e">${"\u2605".repeat(3 - r.stars)}</span></div>${row("Funziona", r.work)}${row("Colori dei fili", r.color)}${row("Sicurezza", r.safe)}${r.pass ? last ? `<p class="next"><b>Hai completato tutti i livelli.</b></p>` : `<div class="next"><button class="btn primary" id="bNext" style="margin-left:0">Livello successivo</button></div>` : ""}`;
  }

  // src/ui2d/app.js
  var $ = (s) => document.querySelector(s);
  var MQ = window.matchMedia("(max-width:919px)");
  var buzz = () => {
    try {
      navigator.vibrate && navigator.vibrate(12);
    } catch (e) {
    }
  };
  var STORAGE_KEY = "lab-elettrico-1";
  var storage = {
    load() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") || {};
      } catch (e) {
        return {};
      }
    },
    save(o) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(o));
      } catch (e) {
      }
    }
  };
  var session = createSession({ levels, deriveFull, storage });
  var S = null;
  var comps = [];
  var lastKey = null;
  var rebuild = false;
  var COL = "marrone";
  var SEL = null;
  var KWH = 42.7;
  var ui = () => ({ mobile: MQ.matches, sel: SEL, kwh: KWH });
  function renderPalette() {
    $("#palette").innerHTML = paletteHTML(COL);
  }
  function setRoomVB() {
    $("#room").setAttribute("viewBox", roomViewBox(S.level, MQ.matches));
  }
  function renderBench() {
    const b = $("#bench");
    b.setAttribute("viewBox", benchViewBox(comps));
    b.innerHTML = benchHTML(S, comps, ui());
  }
  function renderStatus() {
    $("#status").innerHTML = statusHTML(S);
    updateRoom($("#room"), S, comps);
  }
  function renderResult() {
    $("#result").innerHTML = resultHTML(S);
  }
  function setInfo(key, extra, open) {
    const h = HELP[key];
    $("#info").innerHTML = `<button class="x" data-x="1" aria-label="Chiudi">Chiudi</button><h3>${h[0]}</h3><p>${h[1]}</p>${extra ? `<p style="margin-top:8px"><b>Suggerimento:</b> ${extra}</p>` : ""}`;
    $("#info").classList.toggle("open", open !== false);
  }
  function showHint() {
    const h = session.requestHint();
    $("#info").innerHTML = `<button class="x" data-x="1" aria-label="Chiudi">Chiudi</button><h3>Suggerimento ${h.index + 1} di ${h.total}</h3><p>${h.text}</p>`;
    $("#info").classList.add("open");
  }
  function onLevelChange() {
    comps = composeComps(S.level);
    SEL = null;
    $("#kick").textContent = "Livello " + S.level.n + " di " + S.levelCount + (S.mode === "contatore" ? " \xB7 dal contatore" : "");
    $("#lvName").textContent = S.level.title;
    $("#lvGoal").textContent = S.level.goal;
    $("#room").innerHTML = roomHTML(S.level, comps);
    setRoomVB();
    setInfo("morsetto", null, false);
  }
  session.subscribe((s) => {
    S = s;
    if (s.levelKey !== lastKey || rebuild) {
      lastKey = s.levelKey;
      rebuild = false;
      onLevelChange();
    }
    $("#bSol").textContent = s.solutionShown ? "Nascondi soluzione" : "Mostra soluzione";
    $("#bSol").setAttribute("aria-pressed", String(s.solutionShown));
    $("#levels").innerHTML = levelsHTML(s);
    renderBench();
    renderStatus();
    renderResult();
  });
  function svgPt(e) {
    const b = $("#bench"), pt = b.createSVGPoint();
    pt.x = e.clientX;
    pt.y = e.clientY;
    return pt.matrixTransform(b.getScreenCTM().inverse());
  }
  function clearSel() {
    SEL = null;
    document.querySelectorAll(".term.sel").forEach((n) => n.classList.remove("sel"));
    const p = $("#prev");
    if (p) p.setAttribute("d", "");
  }
  function addWire(a, b) {
    if (!a || !b || a === b) return;
    session.addWire(a, b, COL);
    buzz();
  }
  var dragging = false;
  var moved = false;
  var downPt = null;
  var reselect = false;
  var bench = $("#bench");
  function hidePrev() {
    const p = $("#prev");
    if (p) p.setAttribute("d", "");
  }
  bench.addEventListener("pointerdown", (e) => {
    dragging = false;
    const t = e.target.closest("[data-term]");
    if (!t) return;
    const id = t.dataset.term;
    if (SEL && SEL !== id) {
      const a = SEL;
      clearSel();
      addWire(a, id);
      return;
    }
    reselect = SEL === id;
    clearSel();
    SEL = id;
    dragging = true;
    moved = false;
    downPt = { x: e.clientX, y: e.clientY };
    t.classList.add("sel");
  });
  window.addEventListener("pointermove", (e) => {
    if (!SEL) return;
    if (dragging && downPt && Math.hypot(e.clientX - downPt.x, e.clientY - downPt.y) > 10) moved = true;
    if (e.pointerType !== "mouse" && !dragging) return;
    const p = $("#prev");
    if (!p) return;
    const a = termPos(comps, SEL), q = svgPt(e);
    p.setAttribute("d", `M${a.x} ${a.y} L${q.x} ${q.y}`);
  });
  window.addEventListener("pointerup", (e) => {
    if (!dragging) return;
    dragging = false;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const t = el && el.closest ? el.closest("[data-term]") : null;
    if (SEL && t && t.dataset.term !== SEL) {
      const a = SEL;
      clearSel();
      addWire(a, t.dataset.term);
    } else if (SEL && t && t.dataset.term === SEL && reselect && !moved) {
      clearSel();
    } else hidePrev();
  });
  window.addEventListener("pointercancel", () => {
    dragging = false;
    hidePrev();
  });
  bench.addEventListener("click", (e) => {
    const t = e.target.closest("[data-term]");
    if (t) return;
    const h = e.target.closest("[data-help]");
    if (h) {
      setInfo(h.dataset.help);
      return;
    }
    const q = e.target.closest("[data-q]");
    if (q) {
      clearSel();
      session.toggleBreaker();
      return;
    }
    const c2 = e.target.closest("[data-ctl]");
    if (c2) {
      clearSel();
      session.toggleControl(c2.dataset.ctl);
      return;
    }
    const w = e.target.closest("[data-wire]");
    if (w) {
      clearSel();
      session.removeWire(+w.dataset.wire);
      return;
    }
    clearSel();
  });
  bench.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const t = e.target.closest("[data-term]");
    if (t) {
      e.preventDefault();
      const id = t.dataset.term;
      if (SEL && SEL !== id) {
        const a = SEL;
        clearSel();
        addWire(a, id);
      } else {
        clearSel();
        SEL = id;
        t.classList.add("sel");
      }
      return;
    }
    const q = e.target.closest("[data-q]");
    if (q) {
      e.preventDefault();
      session.toggleBreaker();
      return;
    }
    const h = e.target.closest("[data-help]");
    if (h) {
      e.preventDefault();
      setInfo(h.dataset.help);
    }
  });
  $("#room").addEventListener("click", (e) => {
    const c2 = e.target.closest("[data-ctl]");
    if (c2) session.toggleControl(c2.dataset.ctl);
  });
  $("#room").addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      const c2 = e.target.closest("[data-ctl]");
      if (c2) {
        e.preventDefault();
        session.toggleControl(c2.dataset.ctl);
      }
    }
  });
  document.querySelector(".mode").addEventListener("click", (e) => {
    const b = e.target.closest("[data-mode]");
    if (!b || b.dataset.mode === S.mode) return;
    document.querySelectorAll(".seg").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.mode === b.dataset.mode)));
    session.setMode(b.dataset.mode);
  });
  setInterval(() => {
    if (S && S.lit) {
      KWH += 0.1;
      const k = $("#kwh");
      if (k) k.textContent = kwhText(KWH);
    }
  }, 700);
  $("#info").addEventListener("click", (e) => {
    if (e.target.closest("[data-x]")) $("#info").classList.remove("open");
  });
  if (window.ResizeObserver) {
    new ResizeObserver(() => {
      document.documentElement.style.setProperty("--roomH", Math.ceil($(".roomcard").getBoundingClientRect().height) + 8 + "px");
    }).observe($(".roomcard"));
  }
  var onMQ = () => {
    setRoomVB();
    renderBench();
    if (!MQ.matches) $("#info").classList.add("open");
  };
  if (MQ.addEventListener) MQ.addEventListener("change", onMQ);
  $("#palette").addEventListener("click", (e) => {
    const b = e.target.closest("[data-col]");
    if (b) {
      COL = b.dataset.col;
      renderPalette();
    }
  });
  $("#levels").addEventListener("click", (e) => {
    const b = e.target.closest("[data-lv]");
    if (b) {
      rebuild = true;
      session.selectLevel(+b.dataset.lv);
    }
  });
  $("#bUndo").addEventListener("click", () => session.undo());
  $("#bClear").addEventListener("click", () => session.clear());
  $("#bHint").addEventListener("click", showHint);
  $("#bSol").addEventListener("click", () => session.toggleSolution());
  $("#bCheck").addEventListener("click", () => {
    session.check();
    $("#result").scrollIntoView({ behavior: "smooth", block: "nearest" });
  });
  $("#result").addEventListener("click", (e) => {
    if (e.target.id === "bNext") {
      rebuild = true;
      session.nextLevel();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  });
  renderPalette();
  session.start();
})();
</script>
</body>
</html>
