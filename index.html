<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fase e Neutro</title>
<meta name="description" content="Laboratorio di impianti elettrici per chi parte da zero.">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
/* Font incorporati (licenza SIL OFL 1.1, vedi fonts/LICENSE-OFL.txt) */
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/barlow-condensed-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/barlow-condensed-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/ibm-plex-sans-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/ibm-plex-sans-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2')}
/* Layout: sinistra la stanza con la luce, destra il banco di lavoro con i componenti da cablare */
:root{
  --bg:#F3EFE6; --ink:#1B2230; --ink2:#4A5262; --card:#FBF9F4; --line:#D9D3C5;
  --bench:#E6E0D2; --dot:#C4BCA8; --comp:#FBF9F4; --comp-edge:#7A7466; --sch:#6B6759;
  --metal:#CBC6B8; --metal-edge:#625E52; --slot:#2F3B38;
  --accent:#2563A8; --on-accent:#FFFFFF; --ok:#17794A; --bad:#BE2530; --warn:#8F5600;
  --fase:#8B4A24; --neutro:#2563A8; --terra:#4C9A2A; --lamp:#F5B800; --quadro:#1E2635;
  --wall:#D3DCE6; --floor:#B99A70; --skirt:#9AA8B6; --shade:#ECE7DA; --bulb-off:#C7CECB;
  --plate:#F4F5F4; --plate-edge:#8A9692; --rkhi:#FFFFFF; --rklo:#B9C2BF;
  --wire-edge:rgba(18,26,24,.55); --breaker:#EEF0EF; --chip:#EDE8DB; --table:#8A6A48;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A24; --ink:#E9E6DE; --ink2:#AEB4C0; --card:#1E2635; --line:#34405A;
    --bench:#232C3C; --dot:#34405A; --comp:#2B3548; --comp-edge:#7F8DA6; --sch:#A5B1C6;
    --metal:#8F9BB0; --metal-edge:#CBD3E2; --slot:#1C2523;
    --accent:#6EA8E8; --on-accent:#0B1626; --ok:#4CC38A; --bad:#FF6B73; --warn:#E8A33A;
    --fase:#D9955F; --neutro:#6EA8E8; --terra:#6CC24A; --lamp:#F5B800; --quadro:#0F141D;
    --wall:#2B3543; --floor:#4B4036; --skirt:#3A4655; --shade:#B9B3A4; --bulb-off:#53605D;
    --plate:#C9D0CE; --plate-edge:#6F7C78; --rkhi:#F3F6F5; --rklo:#8E9996;
    --wire-edge:rgba(235,243,241,.6); --breaker:#D9DEDD; --chip:#2A3447; --table:#5B4630;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#141A24; --ink:#E9E6DE; --ink2:#AEB4C0; --card:#1E2635; --line:#34405A;
    --bench:#232C3C; --dot:#34405A; --comp:#2B3548; --comp-edge:#7F8DA6; --sch:#A5B1C6;
    --metal:#8F9BB0; --metal-edge:#CBD3E2; --slot:#1C2523;
    --accent:#6EA8E8; --on-accent:#0B1626; --ok:#4CC38A; --bad:#FF6B73; --warn:#E8A33A;
    --fase:#D9955F; --neutro:#6EA8E8; --terra:#6CC24A; --lamp:#F5B800; --quadro:#0F141D;
    --wall:#2B3543; --floor:#4B4036; --skirt:#3A4655; --shade:#B9B3A4; --bulb-off:#53605D;
    --plate:#C9D0CE; --plate-edge:#6F7C78; --rkhi:#F3F6F5; --rklo:#8E9996;
    --wire-edge:rgba(235,243,241,.6); --breaker:#D9DEDD; --chip:#2A3447; --table:#5B4630;
    color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;padding-inline:16px;padding-block:14px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:'Barlow Condensed','IBM Plex Sans',system-ui,sans-serif;font-weight:600;margin:0;letter-spacing:.01em}
h1{font-size:26px;line-height:1.1}
h2{font-size:24px;line-height:1.15}
p{margin:0}
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.lv:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media (min-width:920px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}.left{position:sticky;top:12px}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.kicker{font:500 12px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.goal p{color:var(--ink2);margin-top:6px;max-width:62ch}
.roomcard{padding:0;overflow:hidden}
#room{display:block;width:100%;height:auto}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.pill{font:500 13px/1 'IBM Plex Mono',ui-monospace,monospace;padding:6px 9px;border-radius:6px;background:var(--chip);color:var(--ink)}
.pill.on{background:#FFD25E;color:#2A1B00}
.pill.bad{background:var(--bad);color:#fff}
.pill.ok{background:var(--ok);color:#fff}
.msg{flex-basis:100%;font-size:15px;color:var(--ink2);min-height:22px}
.info h3{font:600 17px/1.2 'Barlow Condensed',sans-serif;margin:0 0 4px;letter-spacing:.02em}
.info p{color:var(--ink2);max-width:62ch}
.mode{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mlabel{font:500 13px/1 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.mlabel.hint{text-transform:none;letter-spacing:0;font:400 14px/1.2 'IBM Plex Sans',sans-serif}
.led.blink{animation:blink 1.4s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.25}}
.palette{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{display:flex;align-items:center;gap:8px;font:500 14px/1 'IBM Plex Sans',sans-serif;background:var(--chip);color:var(--ink);border:1px solid transparent;border-radius:999px;padding:7px 12px 7px 8px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sw{width:30px;height:12px;border-radius:6px;border:1px solid var(--wire-edge);display:block}
.tip{font-size:14px;color:var(--ink2);margin-bottom:8px}
#bench{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button.btn{font:500 15px/1 'IBM Plex Sans',sans-serif;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:11px 14px;cursor:pointer}
button.btn:hover{border-color:var(--comp-edge)}
button.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600;margin-left:auto}
.res h3{font:600 20px/1.2 'Barlow Condensed',sans-serif;margin:0 0 8px}
.stars{font-size:26px;letter-spacing:4px;color:#F2A900;line-height:1}
.stars .e{color:var(--line)}
.row{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 8px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.mark{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 14px/1 'IBM Plex Mono',monospace;color:#fff}
.mark.ok{background:var(--ok)}.mark.ko{background:var(--bad)}.mark.na{background:var(--comp-edge)}
.row b{font-weight:600}
.row ul{margin:2px 0 0;padding-left:18px;color:var(--ink2);font-size:15px}
.next{margin-top:10px}
.muted{color:var(--ink2)}

/* banco di lavoro */
.ttl{font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;fill:var(--ink2)}
.lbl{font:500 11px 'IBM Plex Mono',monospace;fill:var(--ink);pointer-events:none}
.body{fill:var(--comp);stroke:var(--comp-edge);stroke-width:1.5}
.help{cursor:pointer}.help circle{fill:var(--chip);stroke:var(--comp-edge)}.help text{font:600 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)}
.cl{stroke:var(--sch);stroke-width:2.6;fill:none;stroke-linecap:round}
.cl.on{stroke:#F59F00}.cl.off{stroke-dasharray:3 5;opacity:.45}
.ct{fill:var(--comp);stroke:var(--sch);stroke-width:2}
.hole{fill:var(--slot)}
.faceplate{fill:var(--plate);stroke:var(--plate-edge);stroke-width:1.2}
.term{cursor:pointer;touch-action:none}
.term .hit{fill:transparent}
.term .halo{fill:none;stroke:var(--accent);stroke-width:3;opacity:0}
.term:hover .halo{opacity:.55}
.term.sel .halo{opacity:1;animation:pulse 1s ease-in-out infinite}
.screw{fill:var(--metal);stroke:var(--metal-edge);stroke-width:1.6}
.slot{stroke:var(--slot);stroke-width:2.4;stroke-linecap:round}
@keyframes pulse{50%{stroke-width:6}}
.w-hit{fill:none;stroke:transparent;stroke-width:18;cursor:pointer}
.w-edge{fill:none;stroke:var(--wire-edge);stroke-width:9;stroke-linecap:round;pointer-events:none}
.w-col{fill:none;stroke-width:5.5;stroke-linecap:round;pointer-events:none}
.w-col.dash{stroke-dasharray:9 9}
.flow{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:1 12;animation:fl .9s linear infinite;pointer-events:none}
.flow.f{stroke:#FFE08A}.flow.n{stroke:#D7EEFF}
@keyframes fl{to{stroke-dashoffset:-13}}
.ghost{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:3 9;opacity:.8;pointer-events:none}
#prev{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:6 6;pointer-events:none}
.brk{cursor:pointer}
.brk .hs{fill:var(--breaker);stroke:var(--comp-edge);stroke-width:1.5}
.brk .slotr{fill:var(--slot)}
.brk .knob{fill:#fff;stroke:var(--metal-edge);stroke-width:1.4;transition:transform .15s}
.led{fill:var(--comp-edge)}.led.on{fill:#2BD17E}.led.trip{fill:#FF4B55}
/* stanza */
.wall{fill:var(--wall)}.floor{fill:var(--floor)}.skirt{fill:var(--skirt)}
.night{fill:#050816;transition:opacity .55s ease}
.glowc{transition:opacity .55s ease}
.bulb{fill:var(--bulb-off);stroke:var(--comp-edge);stroke-width:1.2;transition:fill .3s}
.bulb.on{fill:#FFD25E;stroke:#E8A100}
.shade{fill:var(--shade);stroke:var(--comp-edge);stroke-width:1.2}
.plate{fill:var(--plate);stroke:var(--plate-edge);stroke-width:1.4}
.rk{stroke:var(--plate-edge);stroke-width:1}
.rk.hi{fill:var(--rkhi)}.rk.lo{fill:var(--rklo)}
.pl{cursor:pointer}
.pl text{font:500 12px 'IBM Plex Sans',sans-serif;fill:#EAF0F8}
@media (prefers-reduced-motion:reduce){.led.blink,.flow,.term.sel .halo{animation:none}.night,.glowc{transition:none}}

.info .x{display:none}
@media (max-width:919px){
  body{padding-block:10px 28px}
  .wrap{gap:10px}
  .top{gap:8px}
  h1{font-size:22px}
  .brand svg{width:26px;height:26px}
  .card{padding:12px}
  .benchcard{padding:12px 0}
  .benchcard>.mode{margin-inline:12px}
  .benchcard>.palette{background:var(--card);margin:0 0 6px;padding:8px 12px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;border-bottom:1px solid var(--line)}
  .benchside{padding-inline:12px}
  .chip{flex-direction:column;align-items:stretch;gap:5px;border-radius:10px;padding:6px 4px 6px;font-size:12px;text-align:center;line-height:1.1;overflow-wrap:anywhere}
  .chip .sw{width:100%;height:12px}
  .seg.chip{flex-direction:row;justify-content:center;padding:9px 14px;font-size:14px;border-radius:999px;min-height:40px;align-items:center}
  .mode{gap:6px}
  .mlabel.hint{flex-basis:100%;font-size:13px}
  #bench{border-radius:0;border-inline:0}
  .term .halo{stroke-width:3.5}
  .lbl{font-size:12px}
  .ttl{font-size:14px}
  .w-hit{stroke-width:24px}
  .actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .actions .btn{padding-inline:6px}
  button.btn{min-height:46px;font-size:16px}
  button.btn.primary{grid-column:1/-1;margin-left:0}
  .info{display:none}
  .info.open{display:block;position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.35);border-color:var(--comp-edge)}
  .info .x{display:block;float:right;margin:-4px -4px 6px 10px;font:500 14px/1 'IBM Plex Sans',sans-serif;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-height:40px}
}

/* ---------- nuova pagina: barra in alto, mappa, introduzione, schede ---------- */
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--bg);padding:10px 14px;z-index:100;border-radius:0 0 8px 0}
.skip:focus{left:0}
a.btn,button.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font:500 15px/1 'IBM Plex Sans',sans-serif;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:11px 14px;min-height:44px;cursor:pointer}
a.btn:hover,button.btn:hover{border-color:var(--comp-edge)}
a.btn.primary,button.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
a.btn.lamp{background:var(--lamp);border-color:var(--lamp);color:#1B2230;font-weight:600;font-size:17px;min-height:52px;width:100%}
a.btn.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600;flex:1}
a.btn.ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.unit .btn.primary{margin-left:0}
button:disabled{cursor:default}

.top{align-items:center;flex-wrap:nowrap;padding-bottom:4px}
.top .brand{text-decoration:none;color:var(--ink)}
.wordmark{white-space:nowrap;font:700 24px/1 'Barlow Condensed','IBM Plex Sans',sans-serif;text-transform:uppercase;letter-spacing:.01em}
.wordmark i{font-style:italic;font-weight:600;text-transform:none;color:var(--fase)}
.player{flex:0 1 auto;min-width:0;min-height:44px;display:flex;align-items:center;gap:8px;background:transparent;color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:0 14px;font:600 14px/1 'IBM Plex Sans',sans-serif;cursor:pointer;max-width:58vw}
.player .pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.player .prank{display:none}
.player .pxp{font:400 13px/1 'IBM Plex Mono',monospace;color:var(--ink2);white-space:nowrap}
@media (max-width:919px){.wordmark{font-size:21px}.player{max-width:44vw}}
@media (min-width:920px){.player .prank{display:inline;font-weight:500;color:var(--ink2)}.player .pname::after{content:" ·";color:var(--ink2)}}

/* mappa */
.homegrid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:920px){.homegrid{grid-template-columns:minmax(0,1fr) 340px;gap:40px}.homeside{position:sticky;top:12px}.only-narrow{display:none}}
@media (max-width:919px){.homeside .cont{display:none}}
.homemain,.homeside{display:flex;flex-direction:column;gap:20px;min-width:0}
.kick{font:500 12px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.cont{background:var(--quadro);color:#F3EFE6;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px}
.cont .kick{color:#8CC3F2}
.cont h2{font:700 34px/1 'Barlow Condensed',sans-serif;text-transform:uppercase}
.cont p{color:#D8D4CA}
.mhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;margin-bottom:10px}
.mhead h2{font:700 32px/1.05 'Barlow Condensed',sans-serif;text-transform:uppercase}
.count{font:400 12px/1 'IBM Plex Mono',monospace;color:var(--ink2)}
.rail{list-style:none;margin:0;padding:0 0 0 42px;position:relative;display:flex;flex-direction:column;gap:12px}
.rail::before{content:"";position:absolute;left:9px;top:16px;bottom:16px;width:12px;background:linear-gradient(90deg,var(--fase) 0 5px,transparent 5px 7px,var(--neutro) 7px 12px)}
.lvcard{position:relative}
.node{position:absolute;left:-42px;top:16px;width:28px;height:28px;border-radius:50%;background:var(--card);border:3px solid var(--ink2)}
.lvcard.cur .node{border-color:var(--lamp)}
.lvcard[data-status="completato"] .node{background:var(--lamp);border-color:var(--ink)}
.lvcard[data-status="saltato"] .node{background:var(--terra);border-color:#2F6A17}
.lvcard.soon .node{border-style:dashed;border-color:#9AA1AE}
.lvbody{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px 14px 14px 16px;display:flex;flex-direction:column;gap:10px}
.lvcard.cur .lvbody{border-color:var(--ink)}
.lvcard.soon .lvbody{border-style:dashed;background:transparent}
.lvhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.lvhead .code{font:400 12px/1 'IBM Plex Mono',monospace;color:var(--ink2)}
.lvhead h3{margin:2px 0 0;font:700 24px/1.05 'Barlow Condensed',sans-serif;text-transform:uppercase}
.lvbody p{font-size:14px;line-height:1.4;color:var(--ink2)}
.lvact{display:flex;gap:8px;flex-wrap:wrap}
.starrow{display:flex;gap:4px}
.pill.st-completato{background:var(--lamp);color:#1B2230}
.pill.st-saltato{background:#2F6A17;color:#fff}
.pill.st-in-corso{background:var(--ink);color:var(--bg)}
.pill.st-soon{background:transparent;border:1px solid var(--line);color:var(--ink2)}
.pill[class*="st-"]{font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:12px;white-space:nowrap;padding:4px 10px;border-radius:999px}
.upcoming{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.upc{border:1.5px dashed #9AA1AE;border-radius:10px;padding:14px 16px}
.uphead{display:flex;justify-content:space-between;gap:8px}
.soonl{font-size:12px;font-weight:600;color:var(--ink2)}
.upc h3{margin:4px 0 0;font:700 24px/1.1 'Barlow Condensed',sans-serif;text-transform:uppercase}
.upc p{font-size:14px;color:var(--ink2);margin-top:4px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:920px){.tools{grid-template-columns:1fr}}
.tool{min-height:52px;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font:600 14px/1.2 'IBM Plex Sans',sans-serif;cursor:pointer;text-align:center}
@media (min-width:920px){.tool{text-align:left;padding:0 16px;min-height:48px;font-size:15px}}
.tool:disabled{color:var(--ink2);border-style:dashed;background:transparent}
.tool small{font-weight:500}

/* barra in basso (telefono) e piè di pagina (computer) */
.tabbar{display:none}
.sitefooter{display:none}
@media (max-width:919px){
  body{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1.5px solid var(--ink);padding:6px 8px calc(10px + env(safe-area-inset-bottom,0px))}

<script>
(() => {
  // src/engine/wires.js
  var WIRE_COLORS = ["marrone", "nero", "grigio", "blu", "gv"];
  var PHASE_COLORS = ["marrone", "nero", "grigio"];
  function allowedColors(role) {
    if (role === "neutro") return ["blu"];
    if (role === "terra") return ["gv"];
    return PHASE_COLORS;
  }

  // src/engine/components.js
  var COMPONENT_TYPES = {
    // Il quadro, nella versione completa (parte dal contatore), collega ingresso e uscita.
    quadro: {
      contacts: (c2) => c2.full ? [["Fi", "F"], ["Ni", "N"], ["PEi", "PE"]] : []
    },
    cont: { contacts: () => [] },
    presa: { contacts: () => [] },
    lamp: { contacts: () => [] },
    // Interruttore: chiuso (1) collega i due morsetti.
    sw: {
      control: true,
      contacts: (c2, st) => st ? [["a", "b"]] : []
    },
    // Deviatore: il comune C va al morsetto 1 (stato 0) oppure al 2 (stato 1).
    dev: {
      control: true,
      contacts: (c2, st) => [["C", st ? "2" : "1"]]
    },
    // Invertitore: in una posizione collega dritto, nell'altra incrocia.
    inv: {
      control: true,
      contacts: (c2, st) => st ? [["1", "4"], ["2", "3"]] : [["1", "3"], ["2", "4"]]
    }
  };
  function contactsOf(component, state) {
    const t = COMPONENT_TYPES[component.type];
    return t ? t.contacts(component, state) : [];
  }

  // src/engine/circuit.js
  function sourceOf(level) {
    return level.src || { F: "Q.F", N: "Q.N", PE: "Q.PE" };
  }
  function makeUF() {
    const p = {};
    function f(x) {
      if (p[x] === void 0) p[x] = x;
      while (p[x] !== x) {
        p[x] = p[p[x]];
        x = p[x];
      }
      return x;
    }
    function u(a, b) {
      p[f(a)] = f(b);
    }
    return { f, u };
  }
  function connect(level, wires, states) {
    const uf = makeUF();
    wires.forEach((w) => uf.u(w.a, w.b));
    level.comps.forEach(
      (c2) => contactsOf(c2, states[c2.id] || 0).forEach(([a, b]) => uf.u(c2.id + "." + a, c2.id + "." + b))
    );
    return uf;
  }
  function analyse(level, wires, states) {
    const uf = connect(level, wires, states);
    const sr = sourceOf(level);
    const F = uf.f(sr.F), N = uf.f(sr.N), PE = uf.f(sr.PE);
    let fault = null;
    if (F === N) fault = "corto";
    else if (F === PE) fault = "faseterra";
    const a = uf.f(level.load[0]), b = uf.f(level.load[1]);
    const lit = !fault && (a === F && b === N || a === N && b === F);
    return { uf, F, N, PE, fault, lit, a, b };
  }
  function potentialOf(analysis, terminalId) {
    const k = analysis.uf.f(terminalId);
    if (k === analysis.F) return "F";
    if (k === analysis.N) return "N";
    if (k === analysis.PE) return "PE";
    return null;
  }

  // src/engine/evaluate.js
  function section() {
    return { ok: false, status: "ko", items: [] };
  }
  function finish(sec) {
    if (sec.ok) sec.status = "ok";
    else if (sec.items.length && sec.items[0].code === "safe.skipped") sec.status = "na";
    else sec.status = "ko";
  }
  function evaluate(level, wires) {
    const ctl = level.controls;
    const combos = [];
    for (let m = 0; m < 1 << ctl.length; m++) {
      const st = {};
      ctl.forEach((id, i) => st[id] = m >> i & 1);
      combos.push(st);
    }
    const res = combos.map((st) => analyse(level, wires, st));
    const out = { work: section(), color: section(), safe: section() };
    const add = (sec, code, params) => out[sec].items.push(params ? { code, ...params } : { code });
    if (!wires.length) {
      add("work", "work.noWires");
      add("color", "color.noWires");
      add("safe", "safe.skipped");
      out.stars = 0;
      out.pass = false;
      finish(out.work);
      finish(out.color);
      finish(out.safe);
      return out;
    }
    const faults = res.filter((r) => r.fault);
    if (faults.length) {
      add("work", faults[0].fault === "corto" ? "work.short" : "work.phaseToEarth");
    } else if (!ctl.length) {
      if (res[0].lit) {
        out.work.ok = true;
        add("work", "work.socketLit");
      } else {
        const r = res[0];
        const anyF = r.a === r.F || r.b === r.F;
        const anyN = r.a === r.N || r.b === r.N;
        if (!anyF) add("work", "work.noPhaseAtSocket");
        if (!anyN) add("work", "work.noNeutralAtSocket");
        if (anyF && anyN) add("work", "work.wrongSocketTerminals");
      }
    } else {
      const anyLit = res.some((r) => r.lit);
      if (!anyLit) {
        const anyF = res.some((r) => r.a === r.F || r.b === r.F);
        const anyN = res.some((r) => r.a === r.N || r.b === r.N);
        add("work", "work.neverLit");
        if (!anyF) add("work", "work.noPhaseAtLoad");
        if (!anyN) add("work", "work.noNeutralAtLoad");
      } else {
        let allGood = true;
        ctl.forEach((id, i) => {
          let flips = 0;
          combos.forEach((st, m) => {
            if (res[m].lit !== res[m ^ 1 << i].lit) flips++;
          });
          if (flips === 0) {
            allGood = false;
            add("work", "work.controlNoEffect", { comp: id });
          } else if (flips < combos.length) {
            allGood = false;
            add("work", "work.controlPartial", { comp: id });
          }
        });
        if (allGood) {
          out.work.ok = true;
          add("work", "work.allControlsOk");
        }
      }
    }
    const uw = makeUF();
    wires.forEach((w) => uw.u(w.a, w.b));
    level.comps.filter((c2) => c2.type === "quadro").forEach((c2) => contactsOf(c2, 0).forEach(([a, b]) => uw.u(c2.id + "." + a, c2.id + "." + b)));
    const sr = sourceOf(level);
    const Fn = uw.f(sr.F), Nn = uw.f(sr.N), Pn = uw.f(sr.PE);
    const bad = [];
    wires.forEach((w) => {
      const k = uw.f(w.a);
      let role = "fase";
      if (k === Nn && k !== Fn) role = "neutro";
      else if (k === Pn && k !== Fn) role = "terra";
      if (!allowedColors(role).includes(w.c)) bad.push({ code: "color.wrong", a: w.a, b: w.b, role });

        if (!levelAt().unit || playMode === "verifica" || mode !== "quadro") return;
        const us = unitState();
        us.phase = "lesson";
        us.page = 0;
        emit();
      },
      answerPrediction(optionId) {
        const level = levelAt();
        const us = level.unit && unitState();
        if (!us || us.phase !== "lesson" || us.pred) return;
        const pg = currentPage();
        if (!pg || pg.type !== "previsione") return;
        const correct = pg.correct === optionId;
        us.pred = { option: optionId, correct };
        if (correct && !(progress.stars[progressKey(level.id, "quadro")] > 0)) {
          progress.best[progressKey(level.id, "quadro")] = progress.best[progressKey(level.id, "quadro")] || { base: 0, pred: false, fault: false, skipped: false };
          progress.best[progressKey(level.id, "quadro")].pred = true;
          save();
        }
        emit();
      },
      // Sfida guasto: si parte da un impianto gia' cablato che non funziona.
      startFault() {
        const level = levelAt();
        const us = level.unit && level.unit.fault && unitState();
        if (!us || !["done", "fault"].includes(us.phase) || playMode === "verifica" || mode !== "quadro") return;
        resetLevelState();
        wiresByKey[keyOf()] = level.unit.fault.wires.map(([a, b, c2]) => ({ id: nextWireId++, a, b, c: c2 }));
        statesByKey[keyOf()] = {};
        resultsByKey[keyOf()] = null;
        us.phase = "fault";
        us.diag = null;
        emit();
      },
      answerDiagnosis(optionId) {
        const level = levelAt();
        const us = level.unit && level.unit.fault && unitState();
        if (!us || us.phase !== "fault" || us.diag) return;
        us.diag = { option: optionId, correct: level.unit.fault.diagnosis.correct === optionId };
        if (!us.diag.correct) us.diagWrong = true;
        emit();
      },
      leaveFault() {
        const us = levelAt().unit && unitState();
        if (!us || us.phase !== "fault") return;
        us.phase = "done";
        emit();
      }
    };
  }

  // src/engine/demo.js
  function frame(level, wires, power, states, caption, newWire) {
    const an = analyse(level, wires, states);
    return {
      caption,
      newWire,
      // id del filo appena aggiunto (per l'animazione), o null
      snap: {
        level,
        wires,
        power,
        trip: false,
        lit: power && an.lit,
        potential: (tid) => potentialOf(an, tid),
        controlStates: { ...states },
        flow: flowOf(level, wires, states),
        flowVisible: true,
        solutionShown: false,
        guide: null,
        message: null
      }
    };
  }
  function demoFrames(level, captions = {}) {
    const sol = level.solution.map(([a, b, c2], i) => ({ id: i + 1, a, b, c: c2 }));
    const out = [];
    for (let k = 1; k <= sol.length; k++) {
      out.push(frame(level, sol.slice(0, k), false, {}, (captions.wires || [])[k - 1] || "", k));
    }
    out.push(frame(level, sol, true, {}, captions.power || "", null));
    const states = {};
    (level.controls || []).forEach((id, i) => {
      states[id] = 1;
      out.push(frame(level, sol, true, states, (captions.controls || [])[i] || "", null));
    });
    return out;
  }
  function blankSnap(level) {
    return frame(level, [], false, {}, "", null).snap;
  }

      return;
    }
    const vk = S.levelKey + "|" + S.playMode;
    if (vk !== lastKey || rebuild) {
      lastKey = vk;
      rebuild = false;
      onLevelChange();
    }
    renderLevelScreen();
  }
  function applyRoute() {
    route = parseRoute();
    if (routeApplied === route.key) {
      render();
      return;
    }
    routeApplied = route.key;
    if (route.name === "level") {
      rebuild = true;
      if (!profile.introSeen && !overlayKind) openIntro();
      session.selectLevel(route.id, { verify: route.verify });
    } else {
      render();
    }
    window.scrollTo(0, 0);
    const m = $("#main");
    if (m && m.focus) m.focus({ preventScroll: true });
  }
  window.addEventListener("hashchange", applyRoute);
  session.subscribe((s) => {
    S = s;
    render();
  });
  function svgPt(e) {
    const b = $("#bench"), pt = b.createSVGPoint();
    pt.x = e.clientX;
    pt.y = e.clientY;
    return pt.matrixTransform(b.getScreenCTM().inverse());
  }
  function clearSel() {
    SEL = null;
    document.querySelectorAll(".term.sel").forEach((n) => n.classList.remove("sel"));
    const p = $("#prev");
    if (p) p.setAttribute("d", "");
  }
  function addWire(a, b) {
    if (!a || !b || a === b) return;
    session.addWire(a, b, COL);
    buzz();
  }
  var dragging = false;
  var moved = false;
  var downPt = null;
  var reselect = false;
  var bench = $("#bench");
  function hidePrev() {
    const p = $("#prev");
    if (p) p.setAttribute("d", "");
  }
  bench.addEventListener("pointerdown", (e) => {
    dragging = false;
    const t = e.target.closest("[data-term]");
    if (!t) return;
    const id = t.dataset.term;
    if (SEL && SEL !== id) {
      const a = SEL;
      clearSel();
      addWire(a, id);
      return;
    }
    reselect = SEL === id;
    clearSel();
    SEL = id;
    dragging = true;
    moved = false;
    downPt = { x: e.clientX, y: e.clientY };
    t.classList.add("sel");
  });
  window.addEventListener("pointermove", (e) => {
    if (!SEL) return;
    if (dragging && downPt && Math.hypot(e.clientX - downPt.x, e.clientY - downPt.y) > 10) moved = true;
    if (e.pointerType !== "mouse" && !dragging) return;
    const p = $("#prev");
    if (!p) return;
    const a = termPos(comps, SEL), q = svgPt(e);
    p.setAttribute("d", `M${a.x} ${a.y} L${q.x} ${q.y}`);
  });
  window.addEventListener("pointerup", (e) => {
    if (!dragging) return;
    dragging = false;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const t = el && el.closest ? el.closest("[data-term]") : null;
    if (SEL && t && t.dataset.term !== SEL) {
      const a = SEL;
      clearSel();
      addWire(a, t.dataset.term);
    } else if (SEL && t && t.dataset.term === SEL && reselect && !moved) {
      clearSel();
    } else hidePrev();
  });
  window.addEventListener("pointercancel", () => {
    dragging = false;
    hidePrev();
  });
  bench.addEventListener("click", (e) => {
    const t = e.target.closest("[data-term]");
    if (t) return;
    const h = e.target.closest("[data-help]");
    if (h) {
      setInfo(h.dataset.help);
      return;
    }
    const q = e.target.closest("[data-q]");
    if (q) {
      clearSel();
      session.toggleBreaker();
      return;
    }
    const c2 = e.target.closest("[data-ctl]");
    if (c2) {
      clearSel();
      session.toggleControl(c2.dataset.ctl);
      return;
    }
    const w = e.target.closest("[data-wire]");
    if (w) {
      clearSel();
      session.removeWire(+w.dataset.wire);
      return;
    }
    clearSel();
  });
  bench.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const t = e.target.closest("[data-term]");
    if (t) {
      e.preventDefault();
      const id = t.dataset.term;
      if (SEL && SEL !== id) {
        const a = SEL;
        clearSel();
        addWire(a, id);
      } else {
        clearSel();
        SEL = id;
        t.classList.add("sel");
      }
      return;
    }
    const q = e.target.closest("[data-q]");
    if (q) {
      e.preventDefault();
      session.toggleBreaker();
      return;
    }
    const h = e.target.closest("[data-help]");
    if (h) {
      e.preventDefault();
      setInfo(h.dataset.help);
    }
  });
  $("#room").addEventListener("click", (e) => {
    const c2 = e.target.closest("[data-ctl]");
    if (c2) session.toggleControl(c2.dataset.ctl);
  });
  $("#room").addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      const c2 = e.target.closest("[data-ctl]");
      if (c2) {
        e.preventDefault();
        session.toggleControl(c2.dataset.ctl);
      }
    }
  });
  document.querySelector(".mode").addEventListener("click", (e) => {
    const b = e.target.closest("[data-mode]");
    if (!b || b.dataset.mode === S.mode) return;
    document.querySelectorAll(".seg").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.mode === b.dataset.mode)));
    session.setMode(b.dataset.mode);
  });
  setInterval(() => {
    if (S && S.lit) {
      KWH += 0.1;
      const k = $("#kwh");
      if (k) k.textContent = kwhText(KWH);
    }
  }, 700);
  $("#info").addEventListener("click", (e) => {
    if (e.target.closest("[data-x]")) $("#info").classList.remove("open");
  });
  if (window.ResizeObserver) {
    new ResizeObserver(() => {
      document.documentElement.style.setProperty("--roomH", Math.ceil($(".roomcard").getBoundingClientRect().height) + 8 + "px");
    }).observe($(".roomcard"));
  }
  var onMQ = () => {
    if (route.name !== "level" || !comps.length) return;
    setRoomVB();
    renderBench();
    if (!MQ.matches) $("#info").classList.add("open");
  };
  if (MQ.addEventListener) MQ.addEventListener("change", onMQ);
  $("#palette").addEventListener("click", (e) => {
    const b = e.target.closest("[data-col]");
    if (b) {
      COL = b.dataset.col;
      renderPalette();
    }
  });
  $("#bUndo").addEventListener("click", () => session.undo());
  $("#bClear").addEventListener("click", () => session.clear());
  $("#bHint").addEventListener("click", showHint);
  $("#bSol").addEventListener("click", () => session.toggleSolution());
  $("#bCheck").addEventListener("click", () => {
    const r = session.check();
    const behavior = REDUCED.matches ? "auto" : "smooth";
    (r.pass ? $(".roomcard") : $("#result")).scrollIntoView({ behavior, block: r.pass ? "start" : "nearest" });
  });
  $("#bFlow").addEventListener("click", () => session.toggleFlow());
  $("#result").addEventListener("click", (e) => {
    if (e.target.id === "bNext") {
      const n = S.levels[S.levelIndex + 1];
      if (n) location.hash = "#/livello/" + n.id;
    }
  });
  function onUnitClick(e) {
    const u = e.target.closest("[data-unit]");
    if (u && !u.disabled) {
      const a = u.dataset.unit;
      if (a === "next") session.unitNext();
      else if (a === "back") session.unitBack();
      else if (a === "skip") session.skipLesson();
      else if (a === "lesson") session.showLesson();
      else if (a === "leaveFault") session.leaveFault();
      return;
    }
    const act = e.target.closest("[data-act]");
    if (act) {
      opener = act;
      const a = act.dataset.act;
      if (a === "summary") openOverlay("summary", summaryHTML(S));
      else if (a === "fault") session.startFault();
      else if (a === "full") {
        document.querySelectorAll(".seg").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.mode === "contatore")));
        session.setMode("contatore");
      }
      return;
    }
    const dm = e.target.closest("[data-demo]");
    if (dm) {
      const a = dm.dataset.demo;
      if (a === "toggle") {
        if (demo.playing) {
          stopDemo();
          drawDemo();
        } else {
          if (demo.i >= demo.frames.length - 1) demo.i = 0;
          startDemo();
        }
      } else if (a === "step") {
        stopDemo();
        if (demo.i < demo.frames.length - 1) demo.i++;
        drawDemo();
      } else if (a === "restart") {
        demo.i = 0;
        startDemo();
      }
      return;
    }
    const p = e.target.closest("[data-pred]");
    if (p) {
      session.answerPrediction(p.dataset.pred);
      return;
    }
    const d = e.target.closest("[data-diag]");
    if (d) session.answerDiagnosis(d.dataset.diag);
  }
  ["#unit", "#lesson", "#sideLinks", "#result"].forEach((id) => $(id).addEventListener("click", onUnitClick));
  var overlay = $("#overlay");
  var overlayKind = null;
  var introI = 0;
  var opener = null;
  function openOverlay(kind, html) {
    overlayKind = kind;
    overlay.innerHTML = html;
    overlay.hidden = false;
    document.body.style.overflow = "hidden";
    const wrap = document.querySelector(".wrap");
    if (wrap) wrap.inert = true;
    const f = overlay.querySelector("input,button,a");
    if (f && f.focus) f.focus({ preventScroll: true });
  }
  function closeOverlay() {
    overlay.hidden = true;
    overlay.innerHTML = "";
    overlayKind = null;
    document.body.style.overflow = "";
    const wrap = document.querySelector(".wrap");
    if (wrap) wrap.inert = false;
    if (opener && opener.focus && document.contains(opener)) opener.focus({ preventScroll: true });
    opener = null;
  }
  function openIntro() {
    introI = 0;
    openOverlay("intro", introHTML(0));
  }
  function finishIntro() {
    profile.introSeen = true;
    saveProfile();
    closeOverlay();
    if (!profile.nameAsked) openName(true);
  }
  function openName(first) {
    openOverlay("name", nameDialogHTML(profile, first));
    overlay.dataset.first = first ? "1" : "";
  }
  function openInfo(kind) {
    openOverlay(kind, modalHTML(kind));
  }
  overlay.addEventListener("click", (e) => {
    const i = e.target.closest("[data-intro]");
    if (i) {
      if (i.dataset.intro === "skip" || introI >= INTRO.length - 1) finishIntro();
      else {
        introI++;
        overlay.innerHTML = introHTML(introI);
        const b = overlay.querySelector("button");
        if (b) b.focus({ preventScroll: true });
      }
      return;
    }
    if (e.target.closest("[data-close]")) {
      closeOverlay();
      return;
    }
    if (e.target.closest("[data-skipname]")) {
      profile.nameAsked = true;
      saveProfile();
      closeOverlay();
      render();
    }
  });
  overlay.addEventListener("submit", (e) => {
    if (e.target.id !== "nameForm") return;
    e.preventDefault();
    profile.name = cleanName(e.target.elements.name.value);
    profile.nameAsked = true;
    saveProfile();
    closeOverlay();
    render();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || overlay.hidden) return;
    if (overlayKind === "intro") finishIntro();
    else {
      if (overlayKind === "name") {
        profile.nameAsked = true;
        saveProfile();
      }
      closeOverlay();
      render();
    }
  });
  document.addEventListener("click", (e) => {
    const o = e.target.closest("[data-open]");
    if (o) {
      opener = o;
      const k = o.dataset.open;
      if (k === "intro") openIntro();
      else openInfo(k);
      return;
    }
    if (e.target.closest("#bPlayer")) {
      opener = e.target.closest("#bPlayer");
      openName(false);
    }
  });
  $("#footer").innerHTML = footerHTML();
  renderPalette();
  session.start();
  applyRoute();
  document.addEventListener("click", (e) => {
    if (e.target.closest('[data-act="print"]')) window.print();
  });
})();
</script>
</body>
</html>
