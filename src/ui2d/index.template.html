<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fase e Neutro</title>
<meta name="description" content="Laboratorio di impianti elettrici per chi parte da zero.">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
/*CSS*/
</style>
</head>
<body>
<a class="skip" href="#main">Vai al contenuto</a>
<div class="wrap">
  <header class="top" id="appbar"></header>

  <main id="main" tabindex="-1">
    <section id="screen-home" hidden aria-label="Mappa dei livelli"></section>

    <section id="screen-level" hidden aria-label="Livello">
      <div class="levelbar"><a class="back" href="#/home">&larr; Mappa</a><span class="lvtag" id="lvTag"></span></div>
      <div class="card lessoncard" id="lesson" hidden></div>
      <div class="work" id="work">
        <div class="card task unit" id="unit"></div>
        <div class="card benchcard">
          <div class="mode" id="modeBar" role="group" aria-label="Punto di partenza"><span class="mlabel">Parti dal</span><button class="chip seg" data-mode="quadro" aria-pressed="true">Quadro</button><button class="chip seg" data-mode="contatore" aria-pressed="false">Contatore</button><span class="mlabel hint">il contatore è la versione completa</span></div>
          <div class="palette" id="palette" role="group" aria-label="Colore del filo"></div>
          <div class="benchrow">
            <div class="benchmain">
              <svg id="bench" role="img" aria-label="Banco di lavoro con i componenti da collegare"></svg>
            </div>
            <div class="benchside">
              <div class="actions">
                <button class="btn" id="bUndo">Annulla</button>
                <button class="btn" id="bClear">Annulla tutto</button>
                <button class="btn" id="bFlow" aria-pressed="false" hidden>Mostra la corrente</button>
                <button class="btn" id="bHint">Suggerimento</button>
                <button class="btn" id="bSol" aria-pressed="false">Mostra soluzione</button>
                <button class="btn primary" id="bCheck">Verifica</button>
              </div>
              <div class="flowlegend" id="flowLegend" hidden></div>
              <div class="sidelinks" id="sideLinks"></div>
            </div>
          </div>
        </div>
        <div class="card res" id="result" aria-live="polite"></div>
        <div class="card roomcard">
          <div class="roomhead"><span>La stanza</span></div>
          <svg id="room" viewBox="0 0 400 250" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Stanza con la luce da accendere"></svg>
          <div class="status" id="status"></div>
        </div>
        <div class="card info" id="info"></div>
      </div>
    </section>
  </main>

  <footer class="sitefooter" id="footer"></footer>
</div>
<nav class="tabbar" id="tabbar" aria-label="Navigazione"></nav>
<div class="overlay" id="overlay" hidden></div>
<script>
/*JS*/
</script>
</body>
</html>
